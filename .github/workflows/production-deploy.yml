name: Production deploy

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: 'Type migrate-production to migrate the direct Neon URL before deploy. Leave empty to deploy without a migration.'
        required: false
        default: ''
        type: string
      release_hold:
        description: 'closed keeps /api unavailable. open follows nickname and version checks. keep preserves the current hold while updating the image.'
        required: false
        default: ''
        type: string
      keep_container:
        description: 'Deploy the Worker release gate without replacing the current API image.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bidplace-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 90
    steps:
      - name: Checkout the selected release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require the release branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production deploy requires main"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require service rules and the Cloudflare account id
        env:
          SERVICE_RULES_OWNER: ${{ vars.SERVICE_RULES_OWNER }}
          SERVICE_RULES_CONTACT: ${{ vars.SERVICE_RULES_CONTACT }}
          SERVICE_RULES_TEXT: ${{ vars.SERVICE_RULES_TEXT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          for name in SERVICE_RULES_OWNER SERVICE_RULES_CONTACT SERVICE_RULES_TEXT CLOUDFLARE_ACCOUNT_ID; do
            value="${!name}"
            trimmed="${value//[[:space:]]/}"
            if [ -z "$trimmed" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing production variables:${missing}"
            exit 1
          fi

      - name: Check Cloudflare configuration
        run: pnpm cloudflare:check

      - name: Build the production SPA
        env:
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: pnpm build:web

      - name: Refuse an unsafe release combination
        env:
          CONFIRM_MIGRATION: ${{ inputs.confirm_migration }}
          RELEASE_HOLD: ${{ inputs.release_hold }}
          KEEP_CONTAINER: ${{ inputs.keep_container }}
        run: |
          if [ "$RELEASE_HOLD" != "closed" ] && [ "$RELEASE_HOLD" != "open" ] && [ "$RELEASE_HOLD" != "keep" ]; then
            echo "release_hold must be closed, open, or keep." >&2
            exit 1
          fi
          if [ "$KEEP_CONTAINER" = "true" ] && [ "$CONFIRM_MIGRATION" = "migrate-production" ]; then
            echo "The preparatory Worker deploy cannot run the migration." >&2
            exit 1
          fi
          if [ "$KEEP_CONTAINER" = "true" ] && [ "$RELEASE_HOLD" != "closed" ]; then
            echo "Keeping the current API image requires release_hold closed." >&2
            exit 1
          fi
          if [ "$RELEASE_HOLD" = "open" ] && [ "$CONFIRM_MIGRATION" = "migrate-production" ]; then
            echo "Opening access cannot run in the same job as the migration." >&2
            exit 1
          fi
          if [ "$RELEASE_HOLD" = "keep" ] && [ "$CONFIRM_MIGRATION" = "migrate-production" ]; then
            echo "A later image update cannot run the slug migration." >&2
            exit 1
          fi

      - name: Verify the production image
        if: inputs.keep_container != true && inputs.release_hold != 'open'
        run: pnpm cloudflare:image:verify

      - name: Reject an ambiguous migration confirmation
        if: inputs.confirm_migration != '' && inputs.confirm_migration != 'migrate-production'
        run: |
          echo "Migration confirmation must be empty or the exact phrase migrate-production"
          exit 1

      - name: Verify production settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OTP_HASH_SECRET: ${{ secrets.OTP_HASH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          TELEGRAM_REDIRECT_URI: ${{ secrets.TELEGRAM_REDIRECT_URI }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CLOUDFLARE_CACHE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          INTERNAL_TICK_SECRET: ${{ secrets.INTERNAL_TICK_SECRET }}
          RELEASE_CONTROL: ${{ secrets.RELEASE_CONTROL }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          expected = "ep-withered-shadow-b230htte"
          required = [
              "CLOUDFLARE_API_TOKEN",
              "DATABASE_URL",
              "NEON_DIRECT_URL",
              "SESSION_SECRET",
              "OTP_HASH_SECRET",
              "S3_ACCESS_KEY_ID",
              "S3_SECRET_ACCESS_KEY",
              "SMTP_PASSWORD",
              "CLOUDFLARE_CACHE_TOKEN",
              "TURNSTILE_SECRET_KEY",
              "INTERNAL_TICK_SECRET",
              "RELEASE_CONTROL",
          ]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing production settings: " + ", ".join(missing))

          for name in ("SESSION_SECRET", "OTP_HASH_SECRET", "INTERNAL_TICK_SECRET"):
              if len(os.environ[name]) < 32:
                  raise SystemExit(f"{name} must be at least 32 characters")
          for provider in ("GOOGLE", "TELEGRAM"):
              names = [f"{provider}_{suffix}" for suffix in ("CLIENT_ID", "CLIENT_SECRET", "REDIRECT_URI")]
              configured = [bool(os.environ.get(name, "").strip()) for name in names]
              if any(configured) and not all(configured):
                  raise SystemExit(f"{provider} configuration must be complete")

          def endpoint(hostname):
              label = hostname.split(".")[0]
              if label.endswith("-pooler"):
                  return label[: -len("-pooler")], True
              return label, False

          def check(name, pooled):
              raw = os.environ.get(name, "")
              try:
                  parsed = urlparse(raw)
              except ValueError:
                  raise SystemExit(f"{name} is invalid")
              host = parsed.hostname or ""
              database = parsed.path.strip("/")
              if parsed.scheme not in ("postgres", "postgresql") or not host.endswith(".neon.tech"):
                  raise SystemExit(f"{name} is not a Neon URL")
              if "sslmode=require" not in parsed.query:
                  raise SystemExit(f"{name} requires sslmode=require")
              if database != "neondb":
                  raise SystemExit(f"{name} database is not neondb")
              identity, is_pooled = endpoint(host)
              if identity != expected:
                  raise SystemExit(f"{name} is not the production endpoint")
              if is_pooled != pooled:
                  raise SystemExit(f"{name} has the wrong pooling mode")

          check("DATABASE_URL", True)
          check("NEON_DIRECT_URL", False)
          print("production neondb endpoints accepted")
          PY

      - name: Require a stopped API before migration
        if: inputs.confirm_migration == 'migrate-production'
        env:
          RELEASE_CONTROL: ${{ secrets.RELEASE_CONTROL }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/release-state.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${RELEASE_CONTROL}" \
            https://bid.place/_release/state)
          if [ "$code" != "200" ]; then
            echo "Migration refused: the previous API is not confirmed stopped." >&2
            exit 1
          fi
          node -e "const state = JSON.parse(require('fs').readFileSync('/tmp/release-state.json', 'utf8')); if (state.status !== 'stopped' && state.status !== 'stopped_with_code') { console.error('Migration refused: container state is not stopped.'); process.exit(1); }"

      - name: Migrate the production database
        if: inputs.confirm_migration == 'migrate-production'
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: pnpm cloudflare:migrate production --confirm-production

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SERVICE_RULES_OWNER: ${{ vars.SERVICE_RULES_OWNER }}
          SERVICE_RULES_CONTACT: ${{ vars.SERVICE_RULES_CONTACT }}
          SERVICE_RULES_TEXT: ${{ vars.SERVICE_RULES_TEXT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OTP_HASH_SECRET: ${{ secrets.OTP_HASH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          TELEGRAM_REDIRECT_URI: ${{ secrets.TELEGRAM_REDIRECT_URI }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CLOUDFLARE_CACHE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          INTERNAL_TICK_SECRET: ${{ secrets.INTERNAL_TICK_SECRET }}
          RELEASE_CONTROL: ${{ secrets.RELEASE_CONTROL }}
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
          TICK_CRON: ${{ vars.TICK_CRON }}
          WORKERS_CI_BRANCH: main
          RELEASE_HOLD: ${{ inputs.release_hold }}
          KEEP_CONTAINER: ${{ inputs.keep_container }}
          CONFIRM_MIGRATION: ${{ inputs.confirm_migration }}
        run: |
          set -euo pipefail
          umask 077
          secrets_dir="$(mktemp -d "${RUNNER_TEMP}/bidplace-secrets.XXXXXX")"
          secrets_file="${secrets_dir}/secrets.json"
          trap 'rm -rf "$secrets_dir"' EXIT
          SECRETS_FILE="$secrets_file" python3 - <<'PY'
          import json, os
          path = os.environ["SECRETS_FILE"]
          names = [
              "DATABASE_URL",
              "SESSION_SECRET",
              "OTP_HASH_SECRET",
              "S3_ACCESS_KEY_ID",
              "S3_SECRET_ACCESS_KEY",
              "SMTP_PASSWORD",
              "CLOUDFLARE_CACHE_TOKEN",
              "TURNSTILE_SECRET_KEY",
              "INTERNAL_TICK_SECRET",
              "RELEASE_CONTROL",
          ]
          missing = [name for name in names if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing deployment secret names: " + ", ".join(missing))
          payload = {name: os.environ[name] for name in names}
          for provider in ("GOOGLE", "TELEGRAM"):
              optional = [provider + suffix for suffix in ("_CLIENT_ID", "_CLIENT_SECRET", "_REDIRECT_URI")]
              configured = [name for name in optional if os.environ.get(name, "").strip()]
              if configured and len(configured) != len(optional):
                  raise SystemExit(provider + " configuration must be complete")
              payload.update({name: os.environ[name] for name in configured})
          payload["SMTP_USERNAME"] = "api_token"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          os.chmod(path, 0o600)
          PY
          args=(production --secrets-file "$secrets_file")
          if [ "$RELEASE_HOLD" = "keep" ]; then
            args+=(--keep-hold)
          elif [ "$CONFIRM_MIGRATION" = "migrate-production" ] || [ "$RELEASE_HOLD" = "closed" ]; then
            args+=(--release closed)
          else
            args+=(--release open)
          fi
          if [ "$KEEP_CONTAINER" = "true" ]; then
            args+=(--keep-container)
          fi
          node scripts/cloudflare/deploy.mjs "${args[@]}"
