name: Verify

# Draft PR: fast and automatic. Ready PR / release pushes / manual: full suite.
# Explicit [build-only] push merge commits run production builds but skip tests and
# Cloudflare verification. Regular pushes, PRs and manual runs are unchanged.
# Feature branches are checked through pull_request only to avoid duplicate runs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
      - master
      - feature/portfolio-mvp-release
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: bidplace_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auction -d bidplace_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_ENV: local
      DATABASE_URL: postgresql://auction:auction@localhost:5432/bidplace_integration?schema=public
      JWT_SECRET: ci-verify-jwt-secret
      TEST_EMAIL_BYPASS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fast checks for draft PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          pnpm typecheck
          pnpm lint
          pnpm --filter @bidplace/config test
          pnpm --filter @bidplace/contracts test
          pnpm --filter @bidplace/api-client test

      - name: Legal registration regression tests for task-3 draft PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true && github.head_ref == 'feat/portfolio-mvp-legal-ux'
        run: |
          pnpm --filter @bidplace/api exec vitest run \
            src/auth/auth.service.spec.ts \
            src/auth/auth.controller.spec.ts \
            src/auth/legal-documents.spec.ts
          pnpm --filter @bidplace/mobile exec vitest run \
            src/features/auth/schemas.spec.ts \
            src/features/auth/auth-dismissal.spec.ts \
            src/features/auth/registration-consent.spec.ts \
            src/features/auth/auth-form-submit.spec.ts

      - name: Work editor regression tests for draft PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          pnpm --filter @bidplace/mobile exec vitest run \
            src/features/sellers/product-catalog-term-sheet.spec.ts \
            src/features/sellers/product-draft-form.spec.ts \
            src/features/sellers/product-draft-fields.spec.ts \
            src/features/sellers/product-draft-save-race.spec.ts \
            src/features/sellers/product-draft-submit-lifecycle.spec.ts \
            src/features/sellers/product-draft-route-guard.spec.ts
          pnpm --filter @bidplace/mobile exec vitest run src/features/admin/AdminWorkCatalogProposals.spec.ts

      - name: Build workspace only (no tests)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-only]')
        run: pnpm build

      - name: Verify workspace
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !contains(github.event.head_commit.message, '[build-only]')
        run: pnpm verify

      - name: Verify Cloudflare routing and configuration
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !contains(github.event.head_commit.message, '[build-only]')
        run: pnpm cloudflare:check

      - name: Build production static assets
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        # Official Cloudflare Turnstile public test site key, verification build only.
        # Release/deploy workflows must use the real site key for their target.
        env:
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: pnpm build:web

      - name: Verify production-like amd64 container
        if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !contains(github.event.head_commit.message, '[build-only]')
        run: pnpm cloudflare:image:verify
