name: Verify

on:
  push:
    branches:
      - main
      - master
      - feature/portfolio-mvp-release
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - feature/portfolio-mvp-release

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: bidplace_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auction -d bidplace_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_ENV: local
      DATABASE_URL: postgresql://auction:auction@localhost:5432/bidplace_integration?schema=public
      JWT_SECRET: ci-verify-jwt-secret
      TEST_EMAIL_BYPASS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm verify
