services:
  postgres:
    image: postgres:16-alpine
    container_name: bidplace-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: bidplace
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    volumes:
      - bidplace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auction -d bidplace']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bidplace_postgres_data:
