services:
  postgres:
    image: postgres:16-alpine
    container_name: bidplace-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: bidplace
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    volumes:
      - bidplace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auction -d bidplace']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bidplace-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      APP_ENV: production
      API_PORT: '3001'
      DATABASE_URL: postgresql://auction:auction@postgres:5432/bidplace?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env for the API container}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      TRUST_PROXY: 'true'
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env for the API container}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in .env for the API container}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE in .env for the API container}
      SMTP_AUTH_MODE: ${SMTP_AUTH_MODE:?Set SMTP_AUTH_MODE in .env for the API container}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env for the API container}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:?Set PASSWORD_RESET_URL_BASE in .env for the API container}
      SERVICE_RULES_OWNER: ${SERVICE_RULES_OWNER:?Set SERVICE_RULES_OWNER in .env for the API container}
      SERVICE_RULES_CONTACT: ${SERVICE_RULES_CONTACT:?Set SERVICE_RULES_CONTACT in .env for the API container}
      SERVICE_RULES_TEXT: ${SERVICE_RULES_TEXT:?Set SERVICE_RULES_TEXT in .env for the API container}
      MEDIA_STORAGE_PROVIDER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

volumes:
  bidplace_postgres_data:
