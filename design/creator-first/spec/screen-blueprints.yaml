# bidplace creator-first — screen blueprints
# Grids/margins from design-system.yaml layout.*. Component IDs from component-specs.yaml.
# Fixtures from content-fixtures.yaml. Measurements pair with responsive constraints;
# absolute values are anchors, not the only layout description.

global_rules:
  safe_area:
    web: "none"
    native: "top inset added to top bar; bottom inset added to bottom_nav / sticky_bid_bar / step shell action"
  required_states_every_screen:
    - default
    - realistic_long_content
    - minimal_content
    - loading (skeleton per section)
    - empty (per empty_state contract)
    - recoverable_error (error_block scope per section)
    - missing_failed_media
    - guest_and_relevant_roles
    - focus_hover_pressed_disabled
    - reduced_motion
    - text_zoom_localization
  scroll_ownership: "One vertical page scroll; rails scroll horizontally inside; dialogs/sheets own internal scroll."

screens:
  # ============================================================
  - id: creator_profile
    priority: "P0-A — design first"
    route: "/{slug}"
    data: [public seller profile (slug, fullName, discipline, country, profilePhotoUrl, shortDescription, links, statusCounts), creator works list (status filter + sort), current release = newest LIVE else soonest SCHEDULED]
    viewports:
      desktop_1440:
        grid: {columns: 12, margins: 80, gutter: 24, max_width: 1280}
        sections:
          - order: 1
            name: hero_identity
            components: [creator_scene desktop]
            layout: "Per creator_scene component contract: identity column cols 1–7, portrait column cols 8–12 (420x560, back accent panel by accent_selection(slug), offset +16/+16, 0deg). Future slot for follow_creator (designed_post_mvp) exists in the component but is never rendered on MVP frames."
            typography: [display_1, caption, body, label]
          - order: 2
            name: current_release
            components: [work_scene profile_release]
            rule: "Omitted entirely when no LIVE/SCHEDULED work."
          - order: 3
            name: works
            components: [section_header leading «Работы», tab_pill status_filter (Все | Сейчас · n | Скоро · n | Завершены · n from statusCounts), work grid]
            grid_pattern: "Deterministic rows: row A = wide (cols 1–8) + standard (9–12); row B = standard + standard + standard (4 cols each); row C = standard (1–4) + wide (5–12); repeat. Card accent fills only on plate variant, max 1 per row."
            card: work_card (no price/deadline; status chips visible only when a status filter other than «Все» is active)
          - order: 4
            name: practice
            components: [story_chapter plain «О практике»]
            rule: "Rendered only when shortDescription > 200 chars; full text here (Get Hyped 19/22 composition: portrait 240x320 left, text right measure 560)."
          - order: 5
            name: archive
            components: [rail archive_rail «Завершённые работы»]
            rule: "Only ENDED works; omitted when none; no sold price."
          - order: 6
            name: footer
            components: [footer]
        sticky: [global_navigation]
      tablet_1024:
        grid: {columns: 12, margins: 48, gutter: 20, max_width: 928}
        transform: "Hero identity keeps split (7/5); works rows collapse to 2-up (wide → full row); scene plate width 400."
      mobile_390:
        grid: {columns: 4, margins: 20, gutter: 16, max_width: 350}
        order:
          - "top bar (back + share)"
          - "creator_scene mobile (portrait card 350x437 with accent back panel offset 8, then identity block: kicker, name display_1 mobile 40, meta caption, statement, links wrap)"
          - "current_release work_scene stacked (media first)"
          - "works section — tab_pill scrollable + single column cards (media ratio alternates 3:4 / 1:1 by list position — layout rhythm only; accents stay per-entity via accent_selection)"
          - "practice chapter"
          - "archive horizontal rail (items 240)"
          - "footer"
          - "bottom_nav"
        notes: "Statement clamp 6 lines with «Ещё» expanding in place (no modal)."
    states:
      minimal_content: "No portrait → creator_scene photo_missing state (accent fill + 96px initial); one work; short statement (fixture creator_minimal, 20 chars): hero keeps composition, works grid = single standard card + no filler."
      long_content: "39-char fixture name (creator_long_names) wraps 2 lines display_1; 469-char statement (creator_rich shortDescription_long) display-truncated at 200 chars with «Ещё» anchor; 24 works paginate «Показать ещё» after 12."
      loading: "Skeletons: hero (media block + 3 text lines), grid 6 cards."
      error: "Works section error_block inline; hero cached/instant."
      empty: "profile_no_works empty_state after tabs."
    annotations_for_pen:
      - "Name never overlaps portrait; two independent columns."
      - "Only one accent surface visible per viewport height at 390."
    acceptance_checks:
      - "Visitor can state creator name, discipline, and open a work within one viewport at 1440 and within two swipes at 390."
      - "No price/deadline anywhere on this screen except status chips under explicit status filters."
      - "Share and links reachable by keyboard in first 10 tab stops."

  # ============================================================
  - id: work_detail
    priority: "P0-B — design second"
    route: "/{slug}/{publicId}"
    data: [public product (title, story, uniqueness, provenance, facts, city, delivery, category, images 1–10, creation intro + steps ≤ 20), listing (status, prices, times, bid count), public bid history, more works by creator]
    viewports:
      desktop_1440:
        grid: {columns: 12, margins: 80, gutter: 24, max_width: 1280}
        sections:
          - order: 1
            name: hero
            layout: "Left cols 1–7: media_stack (front max 560x640). Right cols 9–12 (width 400): creator chip (avatar 32 + name body_strong → profile), future slot wishlist_saved_work detail_pill (designed_post_mvp, never on MVP frames), work title display_2 (max 3 lines), value statement body ink_soft (uniqueness ≤ 120 chars, 2 lines), auction_panel."
            sticky: "auction_panel sticky top 88 while hero+story+process in viewport, LIVE only."
          - order: 2
            name: story
            components: [story_chapter «История работы» (story field), story_chapter filled «Что делает её особенной» (uniqueness full), story_chapter plain «Происхождение» (provenance)]
            rule: "Chapters with accent fill alternate: story plain → uniqueness filled (accent by accent_selection of the work) → provenance plain."
          - order: 3
            name: process
            components: [video_process_story (designed_post_mvp, omitted when absent), process_steps]
            rule: "process_steps omitted when no steps and no intro. video_process_story omitted when video is absent — layout does not reserve a hole. Never rendered on MVP frames."
          - order: 4
            name: facts
            components: [facts_group two_column]
          - order: 5
            name: bid_history
            components:
              - "section_header «Ставки» + bid count"
              - "bid_history_row list (5 + expand)"
              - "link «Как работает аукцион» → rules explainer block (calm accordion: soft-close 60/600s rule, first-bid confirmation, BYN-only)"
          - order: 6
            name: more_from_creator
            components: ["rail work_rail «Ещё от {fullName}» + link «Все работы автора»"]
          - order: 7
            name: footer
            components: [footer]
      tablet_1024:
        transform: "Hero split 6/6 (stack max 480); panel width 360 sticky preserved; facts two_column kept."
      mobile_390:
        order:
          - "top bar (back + share; future slot wishlist_saved_work detail_icon_mobile, designed_post_mvp, never on MVP frames)"
          - "media_stack full-width (controls below: arrow + counter)"
          - "creator chip"
          - "title display_2 mobile 30"
          - "value statement"
          - "auction_panel inline full-width"
          - "story chapters stacked"
          - "process (video_process_story designed_post_mvp then filmstrip items 240; video omitted when absent)"
          - "facts stacked"
          - "bid history"
          - "more rail"
          - "footer"
        sticky: "sticky_bid_bar appears when inline auction_panel leaves viewport; LIVE only; replaces bottom_nav on this screen while visible; page bottom padding 96 + inset."
    listing_states:
      scheduled: "Panel scheduled_preview: start price price_md, «Старт: 24 августа, 19:00», no action, caption «Ставки откроются в момент старта». Chip SCHEDULED. No sticky bar."
      live: "Panel per eligibility variant; chip LIVE; sticky bar mobile."
      soft_close: "Panel soft_close banner + countdown_short; extension announced politely."
      ended_won: "Chip «Продано», final price row, winner alias caption; history intact; no action."
      ended_no_bids: "Chip «Завершено», caption «Аукцион завершён без ставок»; start price row retained."
    states:
      single_image: "media_stack single variant (accent back panel); process omitted if absent; page remains complete."
      long_title: "67-char fixture title (work_long_title_live) wraps 3 lines; panel drops below without overlap (min gap 24)."
      missing_optional_facts: "facts rows omitted; group never shows dashes."
      media_error: "front image missing state; gallery counter excludes failed images."
      loading: "hero skeleton (media + panel), sections lazy skeletons."
      guest_vs_roles: "panel variants: live_guest / live_not_eligible_email / live_not_eligible_rules / live_eligible / leading / outbid / role_disabled_admin / role_disabled_self."
    annotations_for_pen:
      - "Deadline is caption-level everywhere; never larger than price; never red."
      - "Panel and plate never tilt. Only media stack back layers tilt."
      - "Bid history uses aliases exactly as fixtures; no avatars."
    acceptance_checks:
      - "In LIVE at 390: price and bid action visible at all scroll positions (inline panel or sticky bar)."
      - "Reading order desire→story→facts→history holds on all viewports."
      - "All 13 semantic auction_panel states and all 8 semantic bid_dialog states are reachable from this screen; the 19 visual frames live on bid_states_board."

  # ============================================================
  - id: bid_states_board
    priority: "P0 — focused state board (not a route)"
    purpose: "Single Pen board enumerating auction interaction states for QA and build."
    semantic_state_model:
      auction_panel_semantic_states: 13
      auction_panel_state_names: [scheduled_preview, live_guest, live_not_eligible_email, live_not_eligible_rules, live_eligible, leading, outbid, soft_close, ended_won_viewer, ended_lost, ended_no_bids, role_disabled_admin, role_disabled_self]
      bid_dialog_semantic_states: 8
      bid_dialog_state_names: [default, editing, submitting, accepted, stale_minimum, rejected_validation, rejected_server, soft_close_notice]
      visual_frames: 19
      derivation_notes:
        - "19 visual frames cover 21 semantic states (13 panel + 8 dialog): two states are shown inside another state's frame."
        - "Frame 09 is an interaction derivative: dialog accepted and panel leading in one before/after frame."
        - "Frame 07 is a viewport derivative of dialog editing (390 keyboard-open geometry; other frames are 480-wide desktop component frames)."
        - "Frame 14 carries dialog soft_close_notice as a labeled inset inside the panel soft_close frame (the notice only ever appears while the dialog is open during an extension)."
        - "bid_dialog repeat_bid variant (rules row hidden) is a variant of frame 06, documented by annotation, not a separate frame."
        - "auction_panel auxiliary component states (loading, stale_refetch, error) are not semantic auction states; they appear on work_detail loading/error frames."
    frames:  # frame id → panel/dialog semantic state → fixture
      - "01 scheduled_preview — panel.scheduled_preview — fixture work_minimal_scheduled"
      - "02 live_guest — panel.live_guest — fixture work_rich_live"
      - "03 live_not_eligible_email — panel.live_not_eligible_email («Подтвердить почту») — fixture work_rich_live"
      - "04 live_not_eligible_rules — panel.live_not_eligible_rules («Принять правила») — fixture work_rich_live"
      - "05 live_eligible — panel.live_eligible — fixture work_rich_live"
      - "06 bid_dialog_default — dialog.default (first_bid variant; repeat_bid via annotation) — fixture work_rich_live"
      - "07 bid_dialog_editing_390 — dialog.editing (390 keyboard-open derivative) — fixture work_rich_live"
      - "08 bid_dialog_submitting — dialog.submitting — fixture work_rich_live"
      - "09 bid_dialog_accepted_panel_leading — dialog.accepted + panel.leading (interaction derivative) — fixture work_rich_live"
      - "10 bid_dialog_stale_minimum — dialog.stale_minimum — fixture stale_minimum"
      - "11 bid_dialog_rejected_validation — dialog.rejected_validation — fixture work_rich_live"
      - "12 bid_dialog_rejected_server — dialog.rejected_server — fixture rejected_server_example"
      - "13 panel_outbid — panel.outbid — fixture work_rich_live"
      - "14 panel_soft_close — panel.soft_close + dialog.soft_close_notice inset — fixture soft_close_extension"
      - "15 panel_ended_won_viewer — panel.ended_won_viewer (link to Order status) — fixture ended_with_winner"
      - "16 panel_ended_lost — panel.ended_lost (winner alias caption) — fixture ended_with_winner"
      - "17 panel_ended_no_bids — panel.ended_no_bids — fixture ended_no_bids"
      - "18 panel_role_disabled_admin — panel.role_disabled_admin — fixture role_disabled_admin"
      - "19 panel_role_disabled_self — panel.role_disabled_self — fixture role_disabled_self"
    layout: "Grid of 480-wide component frames on canvas, labeled with state id kicker; mobile duplicates only where geometry differs (frame 07; sticky bar geometry lives on work_detail 390 frames)."
    acceptance_checks:
      - "Every state uses server-supplied values verbatim (min bid, times); no client math shown."
      - "Feedback zones identical position across states (no jumping)."
      - "All 19 frames present; frame names match this list and the pen-build-plan frame manifest exactly."

  # ============================================================
  - id: home
    priority: "P1"
    route: "/"
    data: [topAuctions, creators, newWorks — current Home projection only]
    viewports:
      desktop_1440:
        sections:
          - order: 1
            name: manifesto
            layout: "Centered display_1 (2 lines max): «Работы с историей — напрямую от авторов», sub body ink_soft 1 line, top padding 96, bottom 64."
          - order: 2
            name: featured_moment
            components: [work_scene home_featured]
            data_rule: "topAuctions[0]; fallback newWorks[0]; if both empty → section replaced by creators rail promoted up."
          - order: 3
            name: live_rail
            components: [rail work_rail «Сейчас на аукционе»]
            data_rule: "topAuctions[1..6]; status chip LIVE allowed (auction context); no price/deadline; omitted if < 2 items."
          - order: 4
            name: creators_row
            components: [creator_card carousel ×4, no section title]
            layout: "WePresent horizontal peek carousel. Cards 360 / gap 20 / clip to 1280 so the fourth card peeks. No «Авторы» heading (nav already has Авторы). Accent_soft frame per accent_assignments."
          - order: 5
            name: new_works
            components:
              - "section_header centered «Новые работы»"
              - "asymmetric grid: rows pattern as creator_profile.works"
              - "6–8 work_card"
          - order: 6
            name: become_creator_band
            components:
              - "full-width filled band accent_periwinkle_soft radius 28: display_3 «Покажите свою работу миру»"
              - "body 1 line"
              - "creator_action desktop pill"
            rule: "For approved creators band label switches to «Добавьте новую работу»; for pending — honest status line + cabinet link."
          - order: 7
            name: footer
        sticky: [global_navigation]
      tablet_1024:
        transform: "Featured scene plate 400; creators carousel 300-wide with 4th peek; new works 2-up rows."
      mobile_390:
        order: [top bar, manifesto (display_1 40, padding top 48), featured_moment stacked card with 24px peek of next topAuction card behind (WePresent 09 stack cue; static, swipe advances), live_rail horizontal snap, creators carousel (cards 280, no «Авторы» heading), new_works single column (4 cards + «Смотреть все работы» outline button → Explore), become_creator band, footer, bottom_nav]
    states:
      minimal: "Empty topAuctions → featured falls back; empty creators → section omitted; page never shows placeholder cards."
      loading: "manifesto instant (static), sections skeleton."
      error: "per-section error_block; nav/footer always alive."
    annotations_for_pen:
      - "Exactly one display_1 on page (manifesto). Featured scene title is display_2."
      - "Discovery cards are accent_soft frames (WePresent). Founder 2026-08-14: home may show many accent-filled cards in one viewport; the old max-2 cap is lifted for home discovery."
    acceptance_checks:
      - "First viewport at 1440 contains manifesto + featured creator/work/status + nav + creator action."
      - "A first-time visitor sees routes to creators, works, search without scroll at 1440; within one swipe at 390."

  # ============================================================
  - id: explore
    priority: "P1"
    route: "/explore (tabs: works | creators)"
    data: [works search (query, author, status, category, materials, uniqueness, price/year ranges, pagination, sort), creators search (query, pagination, activity/name sort)]
    viewports:
      desktop_1440:
        sections:
          - order: 1
            name: header
            layout: "Title display_2 «Обзор», tab_pill (Работы | Авторы), search_entry full width 640 centered."
          - order: 2
            name: filter_layer
            components:
              - "filter_chip row (works tab: Категория, Статус, Материалы, Уникальность, Цена, Год + Сортировка right-aligned; creators tab: Сортировка only)"
            note: "Transactional narrowing lives here (secondary layer), founder decision 10–11."
          - order: 3
            name: results_works
            layout: "Deterministic mixed grid: 12-col rows [4+4+4] / [8+4] / [4+8] cycling; work_card standard/wide/square by slot; plate variant max 1 per row (accent by each work's accent_selection value)."
            pagination: "«Показать ещё» outline button; server pagination; result count caption top-right («124 работы»)."
          - order: 3_alt
            name: results_creators
            layout: "creator_card grid 4-up rows; workCount visible."
          - order: 4
            name: footer
      tablet_1024:
        transform: "Works rows 2-up ([6+6] / [12] wide); creators 3-up."
      mobile_390:
        order: [top bar with title, search_entry full, tab_pill, filter chips horizontal scroll + «Фильтры» chip opening full sheet (apply/reset), results single column (work_card full-width; every 4th pair renders 2-up squares), «Показать ещё», footer, bottom_nav]
    states:
      status_filter_active: "Cards show status_chip; price/deadline still hidden (price filter narrows without exposing values on cards)."
      no_results: "empty_state explore_no_results + reset action."
      loading_more: "button spinner; existing results stable."
      query_loading: "grid skeleton preserving layout."
      error: "error_block full results zone, filters intact."
    annotations_for_pen:
      - "Masonry is deterministic row templates; never measurement-driven."
      - "Filter chips wrap to sheet on mobile; applied count badge on «Фильтры» chip."
    acceptance_checks:
      - "Works/creators paths separate but one tab-switch apart."
      - "Default cards contain only media/title/creator/descriptor."
      - "Filters reachable by keyboard; applied filters announced with result count."

  # ============================================================
  - id: creator_action_states_board
    priority: "P1 — required initial frame set 8"
    purpose: "Global creator action in all capability states, desktop + mobile shell."
    frames:  # frame id → creator_action variant (names match component-specs exactly)
      - "desktop_guest_or_non_creator — variant guest_or_non_creator: nav with «Стать автором» pill"
      - "desktop_approved — variant approved: nav with «Добавить работу» pill"
      - "desktop_pending_review — variant pending_review: nav with «Кабинет автора» + dot; destination status screen «Заявка на проверке» (icon Clock, honest body, no publish affordance)"
      - "desktop_changes_requested — variant changes_requested: same pill; status screen with correction list + «Исправить и отправить снова»"
      - "desktop_restricted — variant restricted: status screen with real allowed next step only"
      - "mobile_guest_or_non_creator — variant guest_or_non_creator: plus 48 → accessibleLabel «Стать автором»; tapping opens onboarding intro"
      - "mobile_approved — variant approved: plus → work creation step 1"
      - "mobile_pending_review — variant pending_review: plus → cabinet/status screen"
    acceptance_checks:
      - "Action visible in shell on Home, Explore, profile, work detail at all viewports; never overflow-only."
      - "No state visually implies publishing capability that the backend denies."

  # ============================================================
  - id: creator_onboarding_mobile
    priority: "P1 — minimum 390 sequence"
    route: "modal flow from creator_action (guest → auth first with return path)"
    shell: creator_step_shell
    steps:
      - step: 0_intro
        content: "Value screen: display_3 «Станьте автором на bidplace», 3 benefit rows (icon + body: публичный профиль, страница работы со ссылкой, честный аукцион), primary «Создать кабинет», caption «Заявку проверяет модератор»."
      - step: 1_name
        field: "fullName (form_field text, no counter — limit is Missing input per form_field content_limits)"
        question: "Как вас представить?"
        helper: "Имя, псевдоним или название студии"
      - step: 2_discipline_country
        fields: [discipline (text, counter 160 — confirmed limit), country (select, default Беларусь)]
        question: "Чем вы занимаетесь?"
      - step: 3_slug
        field: "slug (form_field text with prefix «bidplace.by/», async availability check)"
        states_required: [loading «Проверяем адрес…», success «Адрес свободен», error «Адрес занят»]
        flag: "Missing input: slug authorship (user-chosen vs generated). Step drops cleanly if generated."
      - step: 4_photo
        component: media_input profile_photo_single
        states_required: [empty, uploading, uploaded, permission_denied, upload_error retry]
        skippable: true
      - step: 5_about
        field: "shortDescription (textarea, no counter — limit is Missing input per form_field content_limits)"
        question: "Расскажите о своей практике"
        helper: "Это увидят посетители вашего профиля"
      - step: 6_links
        fields: [telegramUrl, instagramUrl, websiteUrl, socialLink legacy]
        rule: "Minimum one public link required (legacy contract); inline URL validation."
      - step: 7_review
        component: review_submit creator_application_review
        submit: "«Отправить на проверку» → status screen pending (honest)"
    required_state_frames_390:
      - default (step 1)
      - keyboard_open (step 1, action visible above keyboard)
      - validating_async (step 3 loading)
      - validation_success (step 3)
      - validation_error (step 3)
      - media_permission_denied (step 4)
      - disabled_submit (step 7 incomplete)
      - retry_offline (any step, feedback zone)
      - review_submit (step 7 complete)
      - submitted_status (pending screen)
    acceptance_checks:
      - "One principal task per step; progress zone stable; feedback zone fixed height."
      - "Back preserves data; exit confirm only when data entered («Сохранить черновик?» → contract: local draft only, labeled)."
      - "Vocabulary: автор/кабинет/работа; never post/подписчики."

  # ============================================================
  - id: work_creation_mobile
    priority: "P1 — minimum 390 sequence"
    route: "from creator_action (approved only)"
    shell: creator_step_shell
    steps:
      - step: 1_basics
        fields: ["title (text, no counter — limit is Missing input per form_field content_limits)", "category (select from server; loading + error states)"]
        question: "Что за работа?"
      - step: 2_media
        component: media_input work_gallery_grid (1–10, reorder, cover marker)
        states_required: [empty, uploading progress, limit_reached, permission_denied, upload_error retry]
      - step: 3_story
        field: story (textarea)
        question: "Расскажите историю работы"
      - step: 4_value
        fields: [uniqueness (textarea), provenance (textarea)]
        question: "Почему она особенная?"
      - step: 5_facts
        fields: [technique, materials, dimensions, weight, year, condition, packaging — all optional; city (required), delivery info (required)]
        question: "Факты о работе"
        note: "Optional fields collapsed under «Добавить детали» accordion to keep one screen scannable."
      - step: 6_process
        component: "creation story: intro (textarea, skippable) + steps editor (add up to 20: title, body, image); list with reorder"
        skippable: true
      - step: 7_review
        component: "review_submit work_review (publication checklist — title, story, uniqueness, provenance, city, delivery, category, ≥1 photo)"
        submit: "«Отправить на модерацию» → status «Работа на проверке» (honest; no listing scheduling until approved — scheduling flow follows approval per contract)"
    required_state_frames_390: [default step 2 media grid, uploading, permission_denied, keyboard_open step 3, validation_error step 1 (empty title), disabled_submit review, retry, review complete, submitted_status]
    acceptance_checks:
      - "No price/listing fields in Product creation (Listing scheduling is a separate post-approval flow — one screen stub: date/time + start price BYN + confirm, labeled «после одобрения»)."
      - "Draft is private until moderation approves (status copy honest)."

  # ============================================================
  - id: auth
    priority: "P2 spec (frames after required set)"
    route: "/auth (modal-capable)"
    components: [auth_panel]
    viewports:
      desktop_1440: {layout: "split 50/50: left auth column centered (field width 352), right accent field (fixed accent_periwinkle_soft per accent_selection.fixed_assignments) with one floating work card (fixture image)"}
      mobile_390: {layout: "single column: mini media stack (3 cards from fixtures) → «Привет!» display_1 → body → email field → primary; legal above safe area"}
    states: [default, email_invalid, sending, code_entry, code_error, resend_cooldown, code_success_redirect, server_error]
    acceptance_checks:
      - "One decision per screen; return path honored (bid/onboarding)."
      - "Light, welcoming; no gradient decoration; accent field from approved palette."

  # ============================================================
  - id: tablet_1024_derivations
    priority: "after vertical slice coherence"
    rule: "Tablet derives from desktop with layout.tablet_1024 tokens and the transform notes above. Dedicated frames: creator_profile, work_detail (LIVE), home, explore_works."

  # ============================================================
  - id: future_boards
    priority: "future_board_after_p0 — built only after P0 frames are approved; never mixed with MVP acceptance"
