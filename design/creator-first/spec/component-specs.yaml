# bidplace creator-first — component contract
# Tokens referenced from design-system.yaml. Measurements in px at 1x.
# Every component lists do_not_invent: facts/controls that must NOT appear.

components:
  - id: global_navigation
    purpose: "Calm service chrome: routes, search, role-aware creator action, account."
    anatomy:
      desktop: [logo symbol 28×28 left (no wordmark), nav_links center (Главная, Авторы, Работы), right cluster (search_entry compact, creator_action, auth/account)]
      mobile_top_bar: [logo symbol left, contextual title center (routes), share/back contextual right]
      mobile_bottom_nav: [Главная (nav_home House icon + 11px label), Обзор (nav_explore Compass icon + label), creator_action_plus (48 circle, Plus icon), Профиль/Войти (nav_profile User icon + label)]
    required_data: [current route, auth state, creator capability state]
    optional_data: []
    variants: [desktop, tablet (same as desktop, margins 48), mobile]
    states: [default, scrolled (hairline bottom + surface fill 0.96 opacity), nav_overlay_open, guest, authenticated]
    measurements:
      desktop: {height: 72, link_gap: 32, right_cluster_gap: 12}
      tablet: {height: 64, link_gap: 24}
      mobile: {top_bar_height: 56, bottom_nav: {height: 64, radius: 999, margin_h: 20, float_offset: 12, item_min_width: 64, shadow: e1, bg: surface}}
    interactions:
      - "Nav overlay (mobile): full-screen white rounded panel (radius 24), vertical route list in display_3, then one recommended work card (real newWorks[0]), close + search in bottom pill (WePresent pattern); sheet_enter motion."
      - "Active route: label ink 600 + 2px ink underline offset 6 (desktop); filled ink pill (mobile overlay)."
    accessibility: ["bottom nav items have labels", "overlay traps focus", "logo links home with label «bidplace — на главную»"]
    content_limits: {nav_label_max_chars: 12}
    do_not_invent: ["notifications bell", "cart", "wishlist icon", "messages"]

  - id: creator_action
    purpose: "Persistent role-aware creation entry (founder decision 18–20)."
    anatomy:
      desktop: [ink pill, 20px plus icon white, label 15/600 white]
      mobile: [48x48 ink circle, 24px white plus, in bottom_nav slot 3]
    required_data:
      - "capability state: guest | registered_non_creator | pending_review | changes_requested | approved | restricted"
    optional_data: []
    variants:
      - {state: guest_or_non_creator, label: "Стать автором", destination: "auth (if guest) → creator onboarding, with return path"}
      - {state: approved, label: "Добавить работу", icon: plus, destination: "work creation step 1"}
      - {state: pending_review, label: "Кабинет автора", destination: "status screen «Заявка на проверке»", badge: "ink_soft dot"}
      - {state: changes_requested, label: "Кабинет автора", destination: "status screen with correction path", badge: "error dot 6px + accessible text"}
      - {state: restricted, label: "Кабинет автора", destination: "status screen with real allowed next step"}
    states:
      - "default"
      - "hover (action_primary_hover + lift -1)"
      - "pressed (scale .98)"
      - "focus (ring)"
      - "disabled: none — action always enabled toward an honest destination"
    measurements:
      desktop: {height: 44, padding_h: 20, icon_gap: 8}
      tablet: {height: 44}
      mobile: {circle: 48}
    interactions: ["never inside overflow menu", "mobile accessible label mirrors desktop label per state"]
    accessibility: ["accessibilityLabel = role label", "state badge has text equivalent in destination screen"]
    content_limits: {label_max_chars: 18}
    do_not_invent: ["publish shortcut for pending creators", "camera quick-post", "drafts dropdown"]

  - id: search_entry
    purpose: "Quiet global search entry; routes to Explore with query focus."
    anatomy: [pill surface canvas_deep, 20px search icon ink_soft, placeholder «Поиск работ и авторов» caption ink_soft]
    required_data: []
    optional_data: [prefilled query]
    variants: [desktop_compact (icon+label button 44h), explore_full (input h48), mobile_explore (input h48 full-width)]
    states: [default, hover (bg canvas_deep_hover), focus (ring + border_control), filled, loading (inline spinner 16 right), disabled]
    measurements:
      desktop: {compact: {height: 44, padding_h: 16}, full: {height: 48, radius: 999, padding_h: 20}}
      tablet: {full: {height: 48}}
      mobile: {full: {height: 48}}
    interactions: ["desktop compact click → Explore works tab with focused field", "clear button appears when filled (44 target)"]
    accessibility: ["label «Поиск»", "results count announced politely on Explore"]
    content_limits: {query_max_chars: 120}
    do_not_invent: ["instant suggestion dropdown (no server contract)", "voice search"]

  - id: status_chip
    purpose: "Honest auction/listing status; the only place live_dot exists."
    anatomy: [pill, optional 8px dot, label label_sm]
    required_data: [listing status + relevant time]
    optional_data: []
    variants:
      - {status: LIVE, bg: ink, fg: white, dot: live_dot pulse, label: "Идут торги"}
      - {status: SCHEDULED, bg: surface, border: hairline, fg: ink, label: "Релиз 24 августа, 19:00"}
      - {status: SOFT_CLOSE, bg: accent_yellow_soft, fg: ink, label: "Продлено · 04:12"}
      - {status: ENDED, bg: disabled_surface, fg: ink_soft, label: "Завершено"}
      - {status: ENDED_WON, bg: disabled_surface, fg: ink_soft, label: "Продано"}
    states:
      - "default; reduced_motion: dot static"
    measurements:
      desktop: {height: 28, padding_h: 12, dot_gap: 8}
      tablet: {height: 28}
      mobile: {height: 28}
    interactions: ["non-interactive; never a button"]
    accessibility: ["announced as plain text; dot decorative"]
    content_limits: {label_max_chars: 28}
    do_not_invent: ["«Осталось 3 штуки», «Хит», «Скидка», bid-count on chip"]

  - id: work_card
    purpose: "Default discovery card: desire before commerce."
    anatomy:
      - "media (fixed ratio per slot), inset 16px inside the card so accent_soft reads as a WePresent color frame"
      - "card fill = accent_*_soft from accent_selection of the work (never $surface on discovery cards)"
      - "caption zone: title title_1 (max 2 lines ellipsis) on the same accent fill; ink, not white"
      - "creator name caption ink_soft (1 line)"
      - "optional descriptor caption (1 line)"
      - "corner arrow-up-right 32px circle surface (detail affordance)"
      - "future slot (designed_post_mvp, never on MVP frames): wishlist_saved_work 44 circle, top-right of media, 12 inset; never overlaps the corner arrow"
    required_data: [main image, title, creator fullName, route]
    optional_data: [descriptor (uniqueness first phrase, display truncation at 60 chars), status_chip (only in explicit auction/status contexts), accent fill (by accent_selection of the work)]
    variants:
      - {name: standard, media_ratio: "3:4", caption: "below media on accent_soft frame", grid_span: "span 4 of 12 (desktop/tablet)"}
      - {name: wide, media_ratio: "16:10", grid_span: "span 8 of 12 (desktop/tablet)"}
      - {name: square, media_ratio: "1:1", grid_span: "span 4 of 12 (desktop/tablet); span 2 of 4 in mobile 2-up rows"}
      - {name: plate, note: "Same WePresent frame as standard (accent_soft fill, 16px inset media, caption on the fill). Get Hyped overlapping plate retired on product surfaces after founder 2026-08-14."}
    states: [default, hover (card_lift + media zoom 1.03 + tilt ≤1.2deg), focus (ring on card), pressed, loading (skeleton), image_missing (accent soft fill + 24px ink ImageBroken icon + label «Изображение недоступно» caption)]
    measurements:
      # Widths are 12-col grid spans from design-system layout.*.spans — the grid is authoritative.
      desktop: {standard_width: "span_4 = 410.67", wide_width: "span_8 = 845.33", square_width: "span_4 = 410.67", radius: 24, frame_padding: 16, caption_padding: 0, gap_title_creator: 8}
      tablet: {standard_width: "span_4 = 296", wide_width: "span_8 = 612", square_width: "span_4 = 296"}
      mobile: {full_width: "span_4 = 350", two_up_square_width: "span_2 = 167", rail_width: "280 (rail exception — rails are not grid-bound)"}
    interactions: ["whole card one target → work detail", "corner arrow decorative duplicate of same action (not separately focusable)"]
    accessibility: ["accessible name: «{title} — {creator}»", "descriptor read after name"]
    content_limits: {title_lines: 2, creator_lines: 1, descriptor_chars: 60}
    do_not_invent: ["price", "deadline/countdown", "bid count", "materials/dimensions", "like/save button on MVP frames (wishlist_saved_work is designed_post_mvp, future slot only)", "seller rating"]

  - id: creator_card
    purpose: "Portrait-first creator discovery. Home uses a WePresent framed carousel (no section title). Mirror-caption effect retired on product surfaces after founder 2026-08-14; ink caption sits on accent_soft below the inset portrait."
    anatomy:
      - "accent_soft card fill by accent_selection(slug); padding 16 (color frame around the portrait)"
      - "portrait media 3:4 radius 24, inset, never full-bleed"
      - "caption below: fullName label 15/600 ink (1 line ellipsis; long_name 2 lines)"
      - "discipline caption 13 ink_soft (1 line)"
      - "optional workCount «12 работ» appended to discipline line"
    required_data: [profilePhotoUrl, fullName, slug]
    optional_data: [discipline, workCount]
    variants: [grid (Explore), rail/carousel (Home, peek of next card, no «Авторы» heading)]
    states:
      - "default"
      - "hover (lift + zoom)"
      - "focus"
      - "pressed"
      - "photo_missing (inner portrait slot → accent soft fill by accent_selection(slug) + 48px ink initial letter Piazzolla 600; caption remains ink on the frame)"
      - "long_name (2-line name allowed, caption grows; discipline drops)"
    measurements:
      desktop: {width: 360, frame_padding: 16, carousel_gap: 20, peek: true}
      tablet: {width: 300, carousel_gap: 16, peek: true}
      mobile: {rail_width: 280, carousel_gap: 16, peek: true}
    interactions: ["whole card → creator profile"]
    accessibility: ["name+discipline as accessible name", "ink on accent_soft meets the pair contrast_intent"]
    content_limits: {name_lines: 2, discipline_chars: 40}
    do_not_invent: ["followers", "rating", "verification badge", "location city", "online status"]

  - id: media_stack
    purpose: "Work hero media: one sharp front image with tilted back layers (Get Hyped grammar, bounded)."
    anatomy:
      - "front media card (ratio matches source — 3:4 | 1:1 | 4:3, radius 24, e1)"
      - "back layer 1 (-2.5deg, offset x -16 y 8, next image or accent soft panel)"
      - "back layer 2 (+2deg, offset x 14 y 12, only when ≥3 images)"
      - "gallery controls — right arrow button 44 circle surface e1 + counter caption «2 / 6»"
    required_data: [ordered images (1–10)]
    optional_data: []
    variants:
      - {name: multi, condition: "≥2 images", back_layers: "real next images, desaturated 0.9 opacity"}
      - {name: single, condition: "1 image", back_layers: "one accent soft panel (accent by accent_selection of the work), no counter, no arrow"}
    states: [default, advancing (gallery_advance motion), focus (ring on arrow), reduced_motion (instant swap), image_error (per-image missing state), loading (skeleton front card)]
    measurements:
      desktop: {front_max_width: 560, front_max_height: 640}
      tablet: {front_max_width: 480}
      mobile: {front_width: 350, controls_below: true}
    interactions: ["one visible rightward arrow (founder rule) + swipe/drag + keyboard Left/Right", "tapping front media opens next (mobile) — arrow remains the discoverable control", "back layers non-interactive, hidden from a11y tree"]
    accessibility: ["arrow label «Следующее изображение»", "counter announced «Изображение 2 из 6»"]
    content_limits: {max_images: 10}
    do_not_invent: ["two-arrow decorative pair", "thumbnails strip in hero (thumbnails live in facts/gallery section on desktop only if ≥5 images)", "zoom lightbox (unresolved)", "autoplay video"]

  - id: work_scene
    purpose: "Featured release: scene surface combining media_stack + info plate (profile current release, home featured moment)."
    anatomy:
      - "scene surface (accent soft by accent_selection of the work, radius 28, padding 40 desktop / 20 mobile); clip; horizontal auto-layout on desktop/tablet"
      - "home_featured desktop/tablet: info plate left, media_stack right (stack_zone fits inside the scene — no detached plate, no overflow stack)"
      - "profile_release desktop/tablet: media_stack left, info plate right (founder: painting must not sit under creator_scene portrait on the right)"
      - "mobile: media_stack top, plate below"
      - "info plate: kicker («Текущий релиз» | «Сейчас на bidplace»)"
      - "work title display_2 (max 3 lines)"
      - "creator name body_strong"
      - "one-line value statement body ink_soft (2 lines max)"
      - "status_chip"
      - "CTA primary pill «Открыть работу»"
    required_data: [work (image, title, creator, route), listing status]
    optional_data: [value statement (uniqueness ≤ 120 chars)]
    variants:
      - "profile_release (kicker «Текущий релиз»)"
      - "home_featured (creator emphasis: creator name title_1 above work title)"
      - "plate_tilt (desktop only: plate -1.5deg; default 0)"
    states: [default, hover CTA, no_current_release (component omitted — no empty shell), single_image, reduced_motion]
    measurements:
      desktop: {height_min: 480, plate_width: 480, stack_zone: 560}
      tablet: {height_min: 420, plate_width: 400}
      mobile: {stacked: true, media_first: true, plate_padding: 20}
    interactions: ["CTA → work detail; whole media → work detail"]
    accessibility: ["scene is a region labeled by kicker", "reading order: kicker → title → creator → statement → status → CTA"]
    content_limits: {title_lines: 3, statement_chars: 120}
    do_not_invent: ["price", "deadline as headline (status chip only)", "bid count"]

  - id: creator_scene
    purpose: "Creator profile hero: identity-first composition (name, practice, portrait) before any commerce. Referenced by screen-blueprints creator_profile hero_identity on all viewports."
    anatomy:
      desktop:
        - "identity column (grid cols 1–7): kicker «Автор», fullName display_1 (max 2 lines), meta row caption (discipline · Беларусь · «N работ» from statusCounts sum), statement body (measure 560), creator_links row, share text-button with ShareNetwork icon 20"
        - "portrait column (grid cols 8–12): portrait media card 3:4 420x560 radius 24, back accent soft panel (accent by accent_selection(slug)) offset x+16 y+16, tilt 0deg (identity never tilts)"
        - "future slot (designed_post_mvp, never on MVP frames): follow_creator button after creator_links row"
      tablet:
        - "same 7/5 split; portrait media card 3:4 360x480; back panel offset x+12 y+12"
      mobile:
        - "portrait card full-width 350x437 (3:4 within span_4), back accent panel offset x+8 y+8"
        - "identity block below: kicker, fullName display_1 mobile 40, meta caption, statement, creator_links wrap (2 per row max), share"
        - "future slot (designed_post_mvp): follow_creator full-width secondary button below links"
    media_behavior:
      ratio: "portrait 3:4, fit cover, focal center; no upscaling beyond 1.15x source"
      back_panel: "static accent soft panel; decorative, hidden from a11y tree; never overlaps identity text or interactive targets"
    required_data: [slug, fullName, discipline, country, statusCounts]
    optional_data: [profilePhotoUrl, shortDescription, links (telegramUrl/instagramUrl/websiteUrl/socialLink)]
    variants: [desktop, tablet, mobile]
    states:
      - "default"
      - "photo_missing (portrait card → accent soft fill by accent_selection(slug) + ink initial letter Piazzolla 600 96px centered; back panel kept; announced as «Фото автора отсутствует»)"
      - "minimal_content (statement ≤ 200 chars shown in full, no «Ещё»; missing links row collapses; composition unchanged)"
      - "long_content (fullName wraps to 2 lines display_1 — fixture 39 chars; statement display-truncated at 200 chars with «Ещё» anchor to practice chapter; no ellipsis on the name)"
      - "loading (skeleton: portrait media block + 3 text lines 60/90/40%)"
      - "reduced_motion (no entrance settle; «Ещё» expansion is an instant state swap)"
    measurements:
      desktop: {portrait: {width: 420, height: 560}, statement_measure: 560, column_gap: 24, back_panel_offset: {x: 16, y: 16}}
      tablet: {portrait: {width: 360, height: 480}, statement_measure: 560, back_panel_offset: {x: 12, y: 12}}
      mobile: {portrait: {width: 350, height: 437}, back_panel_offset: {x: 8, y: 8}, block_gap: 24}
    content_dependencies:
      - "statement text = shortDescription; display truncation at 200 chars is a display rule, not a data limit"
      - "meta counter «N работ» = sum of statusCounts values; omitted when 0"
      - "practice chapter (story_chapter «О практике») renders only when shortDescription exceeds the 200-char display truncation"
    missing_media_behavior: "photo_missing state above; never a gray placeholder box, never a stock avatar"
    long_short_content_behavior: "Name: wrap up to 2 lines, then letter-spacing unchanged — layout grows vertically (no clamp/ellipsis on names). Statement: display truncation at 200 chars with «Ещё». Empty statement: identity column closes up; portrait composition unchanged."
    interactions: ["share opens native share sheet / web share API", "«Ещё» expands in place (mobile: 6-line clamp, expand in place, no modal)"]
    accessibility:
      - "fullName is the page h1"
      - "scene is a region labeled «Автор»"
      - "portrait alt «Портрет: {fullName}»; photo_missing announced honestly"
      - "«Ещё» is a real button with expanded state announced"
      - "reading order: kicker → name → meta → statement → links → share"
    reduced_motion: "No settle/entrance animation; expansions are instant; back panel is always static."
    content_limits: {name_lines: 2, statement_display_truncation_chars: 200}
    do_not_invent: ["followers/follower counts", "rating", "verification badge", "edit-profile affordance (owner tools have no contract in packet)", "location beyond country", "price/deadline anywhere"]

  - id: story_chapter
    purpose: "Calm reading module for story/uniqueness/provenance/practice chapters."
    anatomy:
      - "optional kicker"
      - "chapter title display_3"
      - "reading column body (max 640)"
      - "optional media (1–3 images per chapter, layouts: single 4:3 | pair | triptych staggered ±1.5deg)"
    required_data: [title, body text]
    optional_data: [images, chapter number «01» (Piazzolla 600 32 ink 12% opacity, decorative)]
    variants:
      - "plain (canvas bg)"
      - "filled (accent soft bg full-bleed section, radius 28 inside margins)"
      - "thesis_triptych (Get Hyped 17: big short thesis + 3 staggered portraits)"
    states: [default, no_media (text only, measure unchanged), long_text (paragraph split every ≤ 90 words, no scroll traps), loading, error]
    measurements:
      desktop: {column: 640, media_offset_pattern: "img1 y0, img2 y+40, img3 y+16"}
      tablet: {column: 608}
      mobile: {column: 350, media: "full-width stacked, no stagger"}
    interactions: []
    accessibility: ["images carry alt from step titles or «Процесс, шаг N»"]
    content_limits: {title_chars: 80, body_words_per_paragraph: 90}
    do_not_invent: ["author quotes not in data", "pull-quotes with invented text"]

  - id: process_steps
    purpose: "Creation story: intro + up to 20 ordered steps."
    anatomy:
      - "section header «Как создавалась работа»"
      - "optional intro body"
      - "steps: each = number kicker («Шаг 3»)"
      - "step title title_1"
      - "body"
      - "optional image 4:3; every 3rd+ consecutive image-bearing step group may render as filmstrip rail"
    required_data: [ordered steps (title, body)]
    optional_data: [intro, step images, video_process_story (designed_post_mvp; omitted entirely when absent)]
    variants:
      - "list (default)"
      - "filmstrip (≥3 sequential images: horizontal rail, items 3:4 width 280 desktop/240 mobile, alternate tilt ±1.5deg, one right arrow + counter + swipe/keyboard)"
    states: [default, no_steps (section omitted), text_only_steps, reduced_motion (no tilt settle), loading, image_error]
    measurements:
      desktop: {step_gap: 64, filmstrip_gap: 20}
      tablet: {step_gap: 48}
      mobile: {step_gap: 40, filmstrip_item_width: 240}
    interactions: ["filmstrip: same control contract as media_stack"]
    accessibility: ["steps are an ordered list semantically"]
    content_limits: {max_steps: 20, step_title_chars: 80}
    do_not_invent: ["video slots as MVP controls (video_process_story is designed_post_mvp, future boards only)", "timestamps"]

  - id: creator_links
    purpose: "Public contact/social links row."
    anatomy:
      - "chips h40: icon 20 + label (Telegram, Instagram, Сайт, Ссылка for legacy socialLink)"
      - "external-link glyph 16"
    required_data: [at least one link (legacy socialLink required by contract)]
    optional_data: [telegramUrl, instagramUrl, websiteUrl]
    variants: [row (desktop), wrap (mobile 2 per row max)]
    states: [default, hover (bg canvas_deep), focus, pressed]
    measurements:
      desktop: {chip_height: 40, gap: 12, padding_h: 16}
      tablet: {chip_height: 40}
      mobile: {chip_height: 44}
    interactions: ["opens external URL; new tab web / system browser native"]
    accessibility: ["label announces platform + external («Telegram, внешняя ссылка»)"]
    content_limits: {label: "platform name only; never raw URL text; legacy link label «Ссылка» (do not invent platform)"}
    do_not_invent: ["private handoff contacts", "follower counts", "DM buttons"]

  - id: auction_panel
    purpose: "Quiet transaction block on work detail; server-authoritative facts."
    anatomy:
      - "surface white radius 24 border hairline padding 24"
      - "status_chip"
      - "price row: label caption («Текущая ставка» | «Стартовая цена») + price price_lg (LIVE) / price_md (SCHEDULED)"
      - "deadline row caption ink_soft with clock icon 16 («До завершения: 2 дн 4 ч» | «Старт: 24 августа, 19:00»)"
      - "primary action full-width"
      - "helper row: link «Как работает аукцион» label_sm underline"
      - "bid_count caption («7 ставок») linking to history section"
    required_data: [listing status, currency BYN, start/current price, server end time, next minimum (for dialog), bid count]
    optional_data: [soft-close banner]
    # Exactly 13 semantic states (canonical names, synced with screen-blueprints
    # bid_states_board and pen-build-plan). Auxiliary component states (loading,
    # stale_refetch, error) are not semantic auction states and appear on
    # work_detail loading/error frames, not on the bid states board.
    variants:
      - {state: scheduled_preview, price_label: "Стартовая цена", action: "secondary outline «Напомнить» — NOT included (no contract); instead no action, caption «Ставки откроются в момент старта»"}
      - {state: live_guest, action: "primary «Войти, чтобы сделать ставку» → auth with return"}
      - {state: live_not_eligible_email, action: "primary «Подтвердить почту», helper caption explains the one missing step"}
      - {state: live_not_eligible_rules, action: "primary «Принять правила», helper caption explains the one missing step"}
      - {state: live_eligible, action: "primary «Сделать ставку» → bid_dialog"}
      - {state: leading, action: "disabled-look info row success_soft «Вы лидируете · 260 BYN» + secondary «Повысить ставку»"}
      - {state: outbid, banner: "error_soft row «Вашу ставку перебили» + primary «Сделать ставку»"}
      - {state: soft_close, banner: "accent_yellow_soft «Аукцион продлён · осталось 04:12», countdown_short"}
      - {state: ended_won_viewer, note: "buyer context: success_soft «Вы выиграли» + link to Order/handoff status"}
      - {state: ended_lost, rows: "final price row «Финальная ставка», caption winner alias if public («победитель: tikhon_v»), no action"}
      - {state: ended_no_bids, rows: "caption «Аукцион завершён без ставок», no fake demand"}
      - {state: role_disabled_admin, action: "disabled pill + caption «Администратор не участвует в торгах»"}
      - {state: role_disabled_self, action: "disabled pill + caption «Это ваша работа — ставки недоступны»"}
    states: [the 13 semantic variants above, loading (skeleton), stale_refetch (price row shimmer 120ms on update, polite announcement), error (retry block inline)]
    measurements:
      desktop: {width: 400, sticky_top: 88}
      tablet: {width: 360}
      mobile: {full_width: 350, inline_position: "after title/value statement"}
    interactions: ["desktop: sticky within hero+story scroll range (LIVE only; static otherwise)", "price slot reserves width of longest fixture («12 000 BYN») against numeral reflow"]
    accessibility: ["price change announced politely", "deadline is text, not only a ticking clock; countdown updates at minute granularity except soft-close (seconds)"]
    content_limits: {price_max_chars: 10}
    do_not_invent: ["reserve price", "Buy Now", "auto-bid", "proxy ceiling", "payment", "delivery calculator", "external outbid push copy"]

  - id: bid_dialog
    purpose: "Focused first-class bid entry/confirmation (Foundation anatomy, light theme)."
    anatomy:
      - "dialog (desktop 480w radius 28 e3, mobile bottom sheet radius top 24 + safe-area)"
      - "title display_3 «Ваша ставка»"
      - "summary card ink radius 16 padding 16: thumb 64 radius 8"
      - "work title title_2 white (1 line)"
      - "creator caption rgba(255,255,255,0.72)"
      - "row: «До завершения» + value"
      - "row: «Текущая ставка» + price_md white"
      - "amount field: input h52 numeric with suffix «BYN»"
      - "helper zone (fixed h24): «Минимальная ставка: 260 BYN» caption"
