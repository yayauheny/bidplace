    required_data: [work summary, server snapshot (current price, next minimum, end time), first-bid flag, rules version]
    optional_data: []
    variants: [first_bid (rules row visible), repeat_bid (rules row hidden)]
    # Exactly 8 semantic states (canonical names, synced with screen-blueprints
