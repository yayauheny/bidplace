  # ==========================================================================
  # DESIGNED POST-MVP COMPONENTS — full UX contracts, built only on labeled
  # future boards (never on MVP frames, never in MVP acceptance checks).
  # ==========================================================================

  - id: follow_creator
    classification:
      product_phase: designed_post_mvp
      design_status: designed
      backend_status: not_implemented
      pen_priority: future_board_after_p0
      implementation_status: backend_required
    purpose: "Follow a creator to be reminded about future releases. Bidding is MVP; follow creator is post-MVP — both are named in the approved auth copy «Войдите, чтобы делать ставки и следить за авторами»."
    anatomy:
      desktop: "secondary outline pill h44 (ink_outline_button 1.5): Heart icon 20 + label label 15/600 «Следить»; followed: ink fill pill, Heart weight=fill white 20 + «Вы следите»"
      mobile: "same pill full-width (h48) below creator_links in creator_scene mobile order"
    placement:
      desktop: "creator_scene identity column, after creator_links row, gap 16"
      mobile: "creator_scene mobile block, full-width below links wrap"
      rule: "Never on discovery cards, never in navigation, never on work detail (creator chip stays clean)."
    required_data: [creator slug, viewer auth state, followed flag for viewer]
    optional_data: []
    variants: [desktop, mobile]
    states:
      - "anonymous (button visible; press → auth redirect with return path back to this profile; label unchanged «Следить»)"
      - "default (authenticated, not followed)"
      - "followed («Вы следите», Heart fill)"
      - "loading (optimistic: visual state flips immediately, CircleNotch 16 replaces Heart while request is in flight; label keeps target state)"
      - "error (rollback to previous visual state + inline_validation error row «Не получилось. Попробуйте ещё раз», role=alert)"
    optimistic_contract:
      on_press: "Flip visual state immediately; fire request; announce politely («Вы следите за автором» / «Вы больше не следите»)."
      on_error: "Roll back to the pre-press state, show the error row for 5s or until next interaction; no toast, no modal."
      double_press: "Presses during loading are ignored (no queueing)."
    accessibility:
      - "accessibilityLabel: «Следить за автором {fullName}»"
      - "followed state exposed as pressed/selected (aria-pressed true / accessibilityState selected)"
      - "state changes announced politely; error row role=alert"
      - "44x44 minimum target; focus ring per design-system"
    reduced_motion: "State swap is instant; no heart animation."
    future_surfaces: "Followed creators appear in a future «Мои авторы» list (creator_card grid + release status) — concept card on the future board; unresolved until a product decision."
    backend_required:
      required_data: "follow relation (viewer id + creator id + created_at); followed flag included in the public profile payload for authenticated viewers"
      required_endpoint_or_event: "POST /creators/{slug}/follow and DELETE /creators/{slug}/follow (or a single toggle mutation); future event creator.release → follower notification (separate contract)"
      permissions: "authenticated users only; a creator cannot follow themselves; admin accounts excluded (same policy as bidding)"
      optimistic_behavior: "as optimistic_contract above; server response reconciles the flag"
      expected_errors: "401 → auth redirect with return path; 403 (self/admin) → button hidden, never disabled-dead; 409 already-followed → reconcile silently to followed; 5xx/network → rollback + error row"
      analytics_event: "follow_creator_toggled {creatorSlug, action: follow|unfollow, source: creator_profile}"
      graceful_unavailable: "Until the backend exists the button is not rendered at all (feature flag off); the layout slot collapses with no gap; no dead or disabled control is ever shown."
    content_limits: {label_max_chars: 18}
    do_not_invent: ["follower counts", "public follower lists", "notification settings UI", "feed of followed creators", "подписчики vocabulary (use «следить»)"]

  - id: wishlist_saved_work
    classification:
      product_phase: designed_post_mvp
      design_status: designed
      backend_status: not_implemented
      pen_priority: future_board_after_p0
      implementation_status: backend_required
    purpose: "Save a work for later. Template: follow_creator (same anonymous/default/saved/loading/error machine, optimistic rollback, auth redirect). Bidding is MVP; saving a work is designed_post_mvp."
    anatomy:
      desktop_card: "44×44 circle surface e1, Bookmark 20 ink, top-right of work_card media inset 12; saved: Bookmark Fill ink; never overlaps the corner ArrowUpRight"
      mobile_card: "same 44 circle; hit target 44; inset 8 on 390"
      desktop_detail: "secondary outline pill h44 (ink_outline_button 1.5): Bookmark 20 + label 15/600 «Сохранить»; saved: ink fill pill, Bookmark Fill white 20 + «Сохранено»; sits in work_detail hero right column, below creator chip, above title, gap 12"
      mobile_detail: "44 icon-only in the work_detail top bar, left of share; accessibilityLabel required"
    placement:
      work_card: "top-right of media; future slot declared on work_card; never on MVP frames"
      work_detail: "desktop hero identity cluster; mobile top bar; never inside auction_panel"
      rule: "Never in navigation, never on creator_card, never on discovery rails as a second target overlapping the card."
    required_data: [work publicId, viewer auth state, saved flag for viewer]
    optional_data: []
    variants: [card_icon, detail_pill, detail_icon_mobile]
    states:
      - "anonymous (control visible; press → auth redirect with return path back to this work; label unchanged «Сохранить»)"
      - "default (authenticated, not saved)"
      - "saved («Сохранено», Bookmark Fill)"
      - "loading (optimistic: visual state flips immediately, CircleNotch 16 replaces Bookmark while request is in flight; label keeps target state)"
      - "error (rollback to previous visual state + inline_validation error row «Не получилось. Попробуйте ещё раз», role=alert; on card_icon the error is announced only, no layout shift)"
    optimistic_contract:
      on_press: "Flip visual state immediately; fire request; announce politely («Работа сохранена» / «Работа удалена из сохранённых»)."
      on_error: "Roll back to the pre-press state, show the error row for 5s or until next interaction (detail only); no toast, no modal."
      double_press: "Presses during loading are ignored (no queueing)."
    accessibility:
      - "accessibilityLabel: «Сохранить работу {title}»"
      - "saved state exposed as pressed/selected (aria-pressed true / accessibilityState selected)"
      - "state changes announced politely; error row role=alert"
      - "44×44 minimum target; focus ring per design-system"
      - "card_icon is a separate control from the card target; tab order: card → wishlist"
    reduced_motion: "State swap is instant; no bookmark animation."
    future_surfaces: "Saved works appear in a future «Сохранённые работы» list (work_card grid) — concept card on the future board; unresolved until a product decision."
    backend_required:
      required_data: "wishlist relation (viewer id + work publicId + created_at); saved flag included in the public work payload for authenticated viewers"
      required_endpoint_or_event: "POST /works/{publicId}/save and DELETE /works/{publicId}/save (or a single toggle mutation)"
      permissions: "authenticated users only; a creator cannot save their own work (button hidden, never disabled-dead); admin accounts excluded (same policy as bidding)"
      optimistic_behavior: "as optimistic_contract above; server response reconciles the flag"
      expected_errors: "401 → auth redirect with return path; 403 (self/admin) → button hidden; 409 already-saved → reconcile silently to saved; 5xx/network → rollback + error row"
      analytics_event: "wishlist_toggled {workPublicId, action: save|unsave, source: work_card|work_detail}"
      graceful_unavailable: "Until the backend exists the control is not rendered at all (feature flag off); the layout slot collapses with no gap; no dead or disabled control is ever shown."
    content_limits: {label_max_chars: 18}
    do_not_invent: ["saved counts", "public wishlist", "price alerts", "like/heart on works (Heart is follow_creator only)", "избранное vocabulary (use «сохранить»)"]

  - id: video_process_story
    classification:
      product_phase: designed_post_mvp
      design_status: designed
      backend_status: not_implemented
      pen_priority: future_board_after_p0
      implementation_status: backend_required
    purpose: "Optional process-story video inside the creation chapter. Template: media_stack (one media surface, bounded chrome) + process_steps (omission when absent). Never required for layout completeness."
    anatomy:
      - "optional kicker «Видео о процессе» label_sm ink_soft"
      - "player surface radius 24 e1, ratio 16:10, cover poster"
      - "center control 48 circle surface e2: Play / Pause"
      - "bottom-right mute 44 circle surface: SpeakerHigh / SpeakerSlash"
      - "no timeline, no fullscreen, no related videos"
    media_behavior:
      poster: "cover, focal center; poster_asset_id from the work fixture; never a generated frame"
      playback: "native player (expo-av / HTML video); one tap starts; looping forbidden; autoplay forbidden on every platform including reduced-motion"
      tilt: "0deg — player never tilts (process_steps filmstrip tilt does not apply)"
    required_data: [poster_asset_id]
    optional_data: [video_url]
    variants: [desktop, mobile]
    states:
      - "poster (default resting: poster + Play 48; no chrome except the play control)"
      - "ready (asset loaded, not playing; poster visible, Play 48 + mute 44)"
      - "playing (video visible, Pause 48, mute control live)"
      - "paused (current frame held, Play 48)"
      - "muted (SpeakerSlash; may combine with playing or paused; default after first play is unmuted)"
      - "loading (skeleton matching media_stack front card; CircleNotch 24 center; no autoplay after load — lands on ready)"
      - "error (poster dimmed + error_block overlay «Не удалось загрузить видео» + «Повторить»)"
      - "unavailable (component omitted entirely — same collapse as process_steps no_steps; surrounding layout does not reserve a hole)"
    measurements:
      desktop: {width: 560, height: 350, play: 48, mute: 44, radius: 24}
      tablet: {width: 480, height: 300}
      mobile: {width: 350, height: 219, play: 48, mute: 44}
    placement:
      desktop: "work_detail process section, above process_steps list, gap 40; max width 560 in the reading column"
      mobile: "same order, full-width 350; gap 24"
      rule: "Omitted when video is absent or unavailable; process_steps list does not shift horizontally."
    interactions:
      - "Play/Pause toggles playing ↔ paused; first Play from poster goes loading → ready → playing only after explicit tap"
      - "Mute toggles muted; state persists for the session on this work"
      - "No autoplay, no hover-to-play, no scroll-into-view play"
    accessibility:
      - "region labeled «Видео о процессе»"
      - "Play control accessibilityLabel «Смотреть видео о процессе»; Pause «Пауза»"
      - "Mute «Выключить звук» / «Включить звук»"
      - "error role=alert"
      - "keyboard: Space/Enter on focused play control; mute is a separate tab stop"
    reduced_motion: "Autoplay remains forbidden. Playing is allowed only after an explicit tap. No looped motion on the poster. Loading spinner is static under reduced motion (same as skeleton)."
    backend_required:
      required_data: "optional video object on the public product: {url, posterAssetId, durationSeconds}; absence is a first-class null"
      required_endpoint_or_event: "GET product payload field product.video (nullable); no separate stream contract in this packet"
      permissions: "public read when the work is public; no upload UI in this component (work creation video input remains unresolved)"
      optimistic_behavior: "none for playback; poster renders from poster_asset_id immediately"
      expected_errors: "missing url → unavailable (omit); 404/decode failure → error + retry; network → error"
      analytics_event: "video_process_played {workPublicId, source: work_detail}"
      graceful_unavailable: "Until the backend field exists the component is not rendered; process_steps layout is identical to today."
    content_limits: {}
    do_not_invent: ["autoplay", "background video", "captions UI (Missing input: no caption contract)", "quality picker", "PiP", "related videos", "video as a required publication field"]
