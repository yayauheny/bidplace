# bidplace creator-first — design system contract
# Direction: «Культурный выпуск» (see DESIGN-DIRECTION.md)
# All values are exact. Contrast ratios are computed intent (WCAG 2.x relative
# luminance); visual QA re-verifies rendered output.

meta:
  version: 1
  date: "2026-08-13"
  platforms: [web, ios, android]
  runtime: "Expo + React Native + React Native Web"
  viewports:
    desktop: 1440
    tablet: 1024
    mobile: 390
  language_primary: "ru"
  currency: "BYN"
  logo:
    rule: "Existing reversed-b symbol is reused as-is. Redesign, retracing, and recoloring forbidden."
    symbol:
      display_size: {width: 28, height: 28}
      status: available_now
      source_assets:
        folder: "/Users/yayauheny/Downloads/Telegram Desktop/logo_assets_web_expo"
        copied_from: "web/logo-transparent-256.png"
      packet_target: "design/creator-first/assets/logo/logo-transparent-256.png"
      pen_file: "design/creator-first/assets/logo/logo-transparent-256.png"
      gate_m_status: ready
    wordmark: false
    nav_rule: "Navigation uses only the existing reversed-b symbol at 28×28. No wordmark slot, no empty placeholder, no typeset wordmark."

classification:
  # Shared taxonomy for every feature in this packet. Statuses order development;
  # they never limit design scope. Pen shows the whole future application.
  product_phase:
    confirmed_mvp: "Designed and implemented now; part of the MVP acceptance contract."
    designed_post_mvp: "Fully designed now (anatomy, states, a11y, UX contract); implemented later; appears in Pen only on labeled future boards."
    unresolved: "Designed only after an explicit product decision; appears only as a labeled concept card."
  implementation_status:
    available_now: "Current backend supports it."
    backend_required: "Design complete; implementation waits for the declared data/endpoints."
    product_decision_required: "Blocked on a founder/product decision, not on backend."
  rules:
    - "Default for every component and screen in this packet: product_phase confirmed_mvp, implementation_status available_now, unless the item declares otherwise."
    - "Every backend_required feature must declare: required data, required endpoint or event, permissions, optimistic behavior, expected errors, analytics event, and a graceful unavailable state until implemented."
    - "Nothing designed_post_mvp or unresolved may appear on MVP frames or inside MVP acceptance checks."
    - "Build priority order: creator → work → discovery/search → bid/auction → profile and work creation → follow, wishlist, video and other additional scenarios. Priority is assembly order, never permission to delete later capabilities."

accent_selection:
  purpose: "One deterministic accent per entity; identical on every screen and every visit."
  algorithm_pseudocode: |
    # input: stableId — creator.slug for creators, product.publicId for works
    # output: index 0..5 into accent_order
    function accentIndex(stableId):
        h = 0
        for byte in utf8_bytes(stableId):
            h = (h * 31 + byte) mod 2^32
        return h mod 6
  accent_order: [periwinkle, teal, orange, yellow, pink, brown]
  entity_keys:
    creator: "slug"
    work: "publicId"
  forbidden_inputs: ["position in the result list", "sort order", "current date or day", "viewport", "viewer identity or session", "colors derived from user media"]
  collision_note: "Adjacent items may share an accent; that is acceptable — variety comes from real media, not from forced rotation."
  fixed_assignments:
    rule: "Surfaces without an entity id use an explicitly fixed token; never a computed or rotating value."
    auth_accent_field: accent_periwinkle_soft
    become_creator_band: accent_periwinkle_soft
    onboarding_intro_band: accent_teal_soft
    future_board_chips: accent_brown_soft
  precomputed: "Accent expectations for every fixture are precomputed in content-fixtures.yaml accent_assignments; the Pen builder uses those values verbatim and computes nothing."

color:
  # ---------- core neutrals ----------
  canvas:
    value: "#FAF4EA"
    foreground: "#1F2337"
    contrast_intent: "14.2:1 (ink on canvas)"
    usage: "Page background on all screens."
    forbidden_usage: "Never as text color; never behind white text."
  canvas_deep:
    value: "#F1E8D9"
    foreground: "#1F2337"
    contrast_intent: ">= 12:1 with ink"
    usage: "Quiet input/search fills, skeleton base, secondary bands."
    forbidden_usage: "Not for primary buttons or status semantics."
  canvas_deep_hover:
    value: "#EBE1CF"
    foreground: "#1F2337"
    contrast_intent: ">= 11:1 with ink"
    usage: "Hover fill for quiet canvas_deep surfaces (search entry, quiet inputs); pointer devices only."
    forbidden_usage: "Never a resting fill; never for status semantics."
  surface:
    value: "#FFFFFF"
    foreground: "#1F2337"
    contrast_intent: "15.6:1 (ink on white)"
    usage: "Cards, plates, dialogs, form surfaces."
    forbidden_usage: "Never borderless on canvas without hairline or elevation."
  ink:
    value: "#1F2337"
    foreground: "#FFFFFF"
    contrast_intent: "14.7:1 (white on ink)"
    usage: "Primary text; primary buttons; dark summary card in bid dialog; live status chip."
    forbidden_usage: "Not as large decorative section background (max: pills, chips, plates <= 96px tall)."
  ink_soft:
    value: "#4A4F68"
    foreground: null
    contrast_intent: "7.3:1 on canvas, 8.0:1 on white"
    usage: "Secondary text, captions, meta rows, placeholder text."
    forbidden_usage: "Not for body copy below 14px on accent soft fills (use ink)."
  hairline:
    value: "#E4DAC9"
    foreground: null
    contrast_intent: "decorative separator; not a control boundary"
    usage: "Card borders on canvas, dividers, table rules."
    forbidden_usage: "Not as input border (too low contrast)."
  border_control:
    value: "#8A8069"
    foreground: null
    contrast_intent: "3.6:1 vs canvas (>= 3:1 non-text)"
    usage: "Default input/select borders, unchecked checkbox outline."
    forbidden_usage: "Not for text."
  disabled_surface:
    value: "#E4DCCD"
    foreground: "#8A8069"
    contrast_intent: "exempt (disabled)"
    usage: "Disabled buttons and inputs."
    forbidden_usage: "Never for enabled controls."

  # ---------- accent pairs (deterministic per entity, order fixed) ----------
  # Accent index = accent_selection.accentIndex(entity id) — see accent_selection
  # block above. Never position-, sort-, date-, or media-derived.
  accent_periwinkle_strong:
    value: "#4F55B8"
    foreground: "#FFFFFF"
    contrast_intent: "6.3:1 white on strong"
    usage: "Card frames (2px), info-plate fills, kicker chips on scenes."
    forbidden_usage: "No ink text on it; not for error/success meaning."
  accent_periwinkle_soft:
    value: "#C9CCF0"
    foreground: "#1F2337"
    contrast_intent: "9.9:1 ink on soft"
    usage: "Scene fills, chapter surfaces, card fills, auth color field."
    forbidden_usage: "No white text on it."
  accent_teal_strong:
    value: "#1D5F63"
    foreground: "#FFFFFF"
    contrast_intent: "7.3:1 white on strong"
    usage: "Same roles as periwinkle strong."
    forbidden_usage: "No ink text on it."
  accent_teal_soft:
    value: "#C4E0DC"
    foreground: "#1F2337"
    contrast_intent: "11.1:1 ink on soft"
    usage: "Same roles as periwinkle soft."
    forbidden_usage: "No white text on it."
  accent_orange_strong:
    value: "#C14F17"
    foreground: "#FFFFFF"
    contrast_intent: "4.8:1 white on strong (AA normal, borderline — QA re-check)"
    usage: "Frames and plates; label text >= 15px 600 only."
    forbidden_usage: "No ink text; no text below 15px."
  accent_orange_soft:
    value: "#F6D9C4"
    foreground: "#1F2337"
    contrast_intent: ">= 11:1 ink on soft"
    usage: "Scene/chapter fills."
    forbidden_usage: "No white text."
  accent_yellow_strong:
    value: "#E9C64C"
    foreground: "#1F2337"
    contrast_intent: ">= 8:1 ink on strong-yellow"
    usage: "Frames, highlight plates, soft-close banner accent."
    forbidden_usage: "Never white text on yellow."
  accent_yellow_soft:
    value: "#F7E9BE"
    foreground: "#1F2337"
    contrast_intent: ">= 12:1 ink on soft"
    usage: "Scene/chapter fills; soft-close banner fill."
    forbidden_usage: "No white text."
  accent_pink_strong:
    value: "#B23A80"
    foreground: "#FFFFFF"
    contrast_intent: "5.5:1 white on strong"
    usage: "Frames and plates."
    forbidden_usage: "No ink text on it."
  accent_pink_soft:
    value: "#F2D7E4"
    foreground: "#1F2337"
    contrast_intent: ">= 11:1 ink on soft"
    usage: "Scene/chapter fills."
    forbidden_usage: "No white text."
  accent_brown_strong:
    value: "#6E452B"
    foreground: "#FFFFFF"
    contrast_intent: "8.2:1 white on strong"
    usage: "Frames, plates, archive band accents."
    forbidden_usage: "No ink text on it."
  accent_brown_soft:
    value: "#E7D5C5"
    foreground: "#1F2337"
    contrast_intent: ">= 10:1 ink on soft"
    usage: "Scene/chapter fills, ended/archive surfaces."
    forbidden_usage: "No white text."

  # ---------- semantic (reserved; never decorative) ----------
  action_primary:
    value: "#1F2337"
    foreground: "#FFFFFF"
    contrast_intent: "14.7:1"
    usage: "Primary buttons (bid, submit, CTA), creator action pill, active tab pill."
    forbidden_usage: "Not for editorial decoration."
  action_primary_hover:
    value: "#14172A"
    foreground: "#FFFFFF"
    contrast_intent: ">= 15:1"
    usage: "Hover/pressed fill of primary actions."
    forbidden_usage: "-"
  success:
    value: "#1E6B45"
    foreground: "#FFFFFF"
    contrast_intent: "6.5:1 white on success"
    usage: "Inline validation success text/icon, leading-bid confirmation."
    forbidden_usage: "Never as editorial accent or card fill."
  success_soft:
    value: "#DDF0E4"
    foreground: "#1E6B45"
    contrast_intent: ">= 4.5:1 success text on soft"
    usage: "Success banners/rows."
    forbidden_usage: "Not decorative."
  error:
    value: "#B3362B"
    foreground: "#FFFFFF"
    contrast_intent: "6.0:1 white on error; 4.9:1 error text on canvas"
    usage: "Error text, invalid borders, destructive confirm."
    forbidden_usage: "Never decorative; never for live-auction urgency styling."
  error_soft:
    value: "#FAE6E2"
    foreground: "#B3362B"
    contrast_intent: "5.0:1 error text on soft"
    usage: "Error banners, rejected-bid feedback zone."
    forbidden_usage: "Not decorative."
  focus_ring:
    value: "#2E5AE8"
    foreground: null
    contrast_intent: "5.1:1 vs canvas, >= 3:1 vs all soft fills (QA re-check per fill)"
    usage: "2px outer focus ring on all interactive elements (light surfaces)."
    forbidden_usage: "Never as text/decoration; on ink surfaces use focus_ring_inverse."
  focus_ring_inverse:
    value: "#FFFFFF"
    foreground: null
    contrast_intent: ">= 3:1 on ink"
    usage: "2px focus ring on ink/dark surfaces (plus 1px #1F2337 inner offset)."
    forbidden_usage: "-"
  live_dot:
    value: "#35C97E"
    foreground: null
    contrast_intent: "non-text indicator inside ink chip; paired with text label"
    usage: "8px dot inside live status chip only."
    forbidden_usage: "Anywhere else; never text; never a bare color-only signal (label always present)."
  scrim:
    value: "rgba(31,35,55,0.50)"
    foreground: null
    contrast_intent: "dialog backdrop"
    usage: "Behind dialogs/sheets."
    forbidden_usage: "Not on media as text background (use mirror_caption veil)."
  mirror_caption_veil:
    value: "rgba(31,35,55,0.55)"
    foreground: "#FFFFFF"
    contrast_intent: "white 15/600 text on veil-over-any-image >= 4.5:1 (veil guarantees floor; QA verifies worst-case light image)"
    usage: "Overlay on the mirrored/blurred strip inside creator_card only."
    forbidden_usage: "Any other component; any full-page use."
  mirror_caption_fallback:
    value: "#1F2337"
    foreground: "#FFFFFF"
    contrast_intent: "14.7:1"
    usage: "Opaque fallback when blur is unavailable/disabled or image missing."
    forbidden_usage: "-"

