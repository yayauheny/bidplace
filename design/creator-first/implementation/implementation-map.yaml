meta:
  name: creator-first-implementation-map
  version: 1
  status: binding
  source_specs:
    - design/creator-first/spec/design-system.yaml
    - design/creator-first/spec/component-specs.yaml
    - design/creator-first/spec/screen-blueprints.yaml
    - design/creator-first/spec/content-fixtures.yaml
  contract: design/creator-first/implementation/TECHNICAL-IMPLEMENTATION-CONTRACT.md
  visual_reference_policy: creator-first specs only; old UI is behavior reference, never visual reference
  component_count: 34
  screen_count: 11

stack:
  app: apps/mobile (single Expo app for web + iOS + Android)
  expo: 57.0.4
  expo_router: 57.0.4
  react: 19.2.3
  react_native: 0.86.0
  react_native_web: 0.21.2
  typescript: 6.0.3
  server_state: "@tanstack/react-query 5.101.2"
  forms: "react-hook-form 7.81.0 + @hookform/resolvers 5.4.0 + zod 3.25.76"
  images: "expo-image 57.0.1"
  motion: "react-native-reanimated 4.5.0 (activate; currently unused)"
  gestures: "react-native-gesture-handler 2.32.0"
  overlays: "@rn-primitives/dialog 1.5.2 + @rn-primitives/portal"
  realtime: "socket.io-client 4.8.1 (events -> React Query invalidation)"
  contracts: "@bidplace/contracts (zod)"
  api_client: "@bidplace/api-client (fetch + zod validation)"
  tokens: "@bidplace/design-tokens (rewritten in Wave 0)"
  e2e: "@playwright/test 1.61.1 (API + Expo web harness)"
  unit: "vitest 4.1.10 (node env, pure logic)"
  react_compiler: not enabled; manual memo rules apply

dependency_policy:
  rule: no dependency without a named owner component; must support Expo native + RNW or declare platform fallback
  add:
    - name: phosphor-react-native
      owner_component: primitives/Icon
      reason: canonical Phosphor icons per design contract; renders via installed react-native-svg
    - name: piazzolla-golos-ttf-assets
      kind: repo assets (not npm)
      owner_component: font-gate (app/_layout)
      reason: build-time embedded typography via expo-font config plugin
  keep_activate:
    - name: react-native-reanimated
      owner_component: primitives/InteractiveSurface
  remove_later:  # Wave 9
    - "@gorhom/bottom-sheet"
    - nativewind
    - tailwindcss
    - react-native-css-interop
    - lucide-react-native
    - "@expo-google-fonts/inter"
    - "@expo-google-fonts/onest"
    - expo-linear-gradient
  defer:
    - name: expo-video
      owner_component: composite/VideoProcessStory
      condition: install only in the post-MVP video wave
  do_not_add:
    - "@shopify/flash-list"
    - expo-blur
    - zustand
    - moti

architecture_layers:
  - id: L0
    name: tokens
    path: packages/design-tokens/src
  - id: L1
    name: primitives
    path: apps/mobile/src/components/ui/primitives
  - id: L2
    name: controls
    path: apps/mobile/src/components/ui/controls
  - id: L3
    name: composite
    path: apps/mobile/src/components/ui/composite
  - id: L4
    name: scenes
    path: apps/mobile/src/components/ui/scenes
  - id: L5
    name: screens
    path: apps/mobile/src/app + apps/mobile/src/features

import_rules:
  - a layer may import only lower layers and lib/
  - features own queries/mutations/presentation mapping; components/ui is data-source-agnostic
  - new code must not import legacy designTokens alias or legacy visual components
  - raw expo-image imports allowed only inside primitives/MediaImage
  - phosphor imports allowed only inside primitives/Icon

token_owner:
  package: "@bidplace/design-tokens"
  structure: primitive -> semantic -> component
  files: [primitives.ts, semantic.ts, component.ts]
  breakpoints: { mobileMax: 767, tabletMin: 768, desktopMin: 1280 }
  layout: { maxContentDesktop: 1280, maxContentTablet: 928, gutters: [32, 24, 20] }
  legacy_alias: deprecated designTokens export removed in Wave 9
  rule: one visual role = one canonical token; Pen values enter code only through this package

responsive_strategy:
  hook: useBreakpoint (only allowed useWindowDimensions consumer for layout)
  helpers: [Container, buildGridRows, getSpanWidth]
  helper_path: apps/mobile/src/components/ui/layout
  compositions: conditional composition per breakpoint inside scenes/screens; no absolute-position reordering
  forbidden: route-local width comparisons; Dimensions.get in components; per-screen breakpoint constants
  horizontal_scroll: only Rail and MediaStack; e2e overflow guards at 390/1024/1440

motion_strategy:
  engine: reanimated (get/set API) + gesture-handler
  rule: animate transform and opacity only; no layout animation without written contract exception
  press_surface: primitives/InteractiveSurface (Gesture.Tap pressed state, interpolate visuals)
  pressable_direct: allowed only for non-animated tap targets
  infinite_animation: LIVE pulse only (StatusChip), disabled under reduced motion
  reduced_motion: useReducedMotion + getMotionDuration mandatory on every duration
  forbidden: [WebGL, RN Animated for new code, PanResponder for new gestures, decorative infinite loops]

media_strategy:
  primitive: primitives/MediaImage (wraps expo-image, absorbs media-recovery.ts retry machine)
  retry: "1s, 3s, 8s with cache-bust, then manual retry"
  missing_media: MediaFallback deterministic block (no request)
  focal_point: contentPosition, default center
  placeholders: surface-tone block (no blurhash in MVP)
  alt_required: alt or explicit decorative flag
  forbidden: raw Image/expo-image usage outside primitives; lightbox dependencies

overlay_strategy:
  component: composite/AdaptiveModal
  base: "@rn-primitives/dialog + portal"
  presentation: dialog >=768 / bottom-sheet panel <768 (radius top 24, translateY enter)
  behavior: [focus trap, focus return, escape, android back, backdrop close unless blocking, keyboard avoidance, safe-area, aria-modal]
  serves: [bid dialog, explore filters mobile, navigation overlay, auth gate, validation info, future selection dialogs]
  no_snap_points: true
  forbidden: gorhom bottom-sheet usage; native Modal formSheet fork; per-feature bespoke overlays

form_strategy:
  library: react-hook-form + zodResolver + packages/contracts schemas (all creator-first forms)
  step_flows: composite/StepShell with typed step config; one RHF form spans steps
  async_validation: debounced 300ms queryClient.fetchQuery (slug/username availability)
  draft_hydration: useForm values from server draft query
  media_upload: composite/MediaInput over existing expo-image-picker -> FormData pipeline
  forbidden: ad-hoc useState field forms in new/migrated flows; local-storage drafts

auction_state_strategy:
  snapshot: React Query (products, listing bids, activity)
  realtime: useListingRealtime socket events -> invalidation only (listing.updated, bid.placed, listing.ended)
  presentation: pure deriveAuctionPanelState in features/products/presentation (13 panel states)
  dialog_machine: 8 states from RHF validity + mutation status + server error codes
  client_must_not: [compute minimum bid, simulate soft close, derive winner, optimistic acceptance, mask bidders client-side]
  countdown: derived from server endsAt; 1s tick only while live panel mounted
  sticky_bar: scroll-driven visibility; same derived state and mutation as panel

testing_strategy:
  unit: [auction panel state derivation, bid dialog machine, grid math, breakpoint map, price formatting, media recovery, step config, slug debounce]
  e2e: [screen flows, overlay a11y, keyboard bid path, reduced motion, image error recovery, filter/pagination, long and minimal content fixtures]
  visual: playwright screenshots 1440x900 / 1024x768 / 390x844 per screen; manual Pen comparison at wave gates
  ci_assertions: no horizontal overflow, grid column counts, sticky bar visibility
  forbidden: large pixel-diff snapshot suite as CI gate

