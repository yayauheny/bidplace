implementation_waves:
  - wave: 0
    scope: phosphor dependency, font assets + expo-font plugin, design-tokens rewrite, tabular-nums verification
    stop_gate: typecheck and token tests green
  - wave: 1
    scope: primitives (Text, Surface, InteractiveSurface, MediaImage, Icon, ScreenScroll, VisuallyHidden) + layout helpers
    stop_gate: primitive API review
  - wave: 2
    scope: controls + AdaptiveModal
    stop_gate: control gallery screenshots at three viewports
  - wave: 3
    scope: cards, scenes, rails, story and facts composites, SiteFooter
    stop_gate: screenshots vs Pen masters
  - wave: 4
    scope: creator_profile screen
    stop_gate: founder visual approval
  - wave: 5
    scope: work_detail + auction vertical (panel, dialog, sticky bar, derivation, realtime)
    stop_gate: founder approval + legacy bid e2e green
  - wave: 6
    scope: home + explore + GlobalNavigation chrome
    stop_gate: founder approval
  - wave: 7
    scope: creator publishing flows + RHF migration of seller drafts
    stop_gate: founder approval
  - wave: 8
    scope: designed_post_mvp features, only after server contracts and founder go
    stop_gate: product decision
  - wave: 9
    scope: legacy deletion (components, nativewind stack, lucide, google-fonts, gradient, gorhom, deprecated token alias) + full QA
    stop_gate: final founder sign-off

forbidden_patterns:
  - copying DOM/Tailwind/shadcn/21st.dev component code into Expo/RNW
  - screen-local token values or breakpoint constants
  - duplicate card, dialog, or navigation components per screen
  - separate web-only and mobile-only UI trees
  - client-owned auction business rules or optimistic bid acceptance
  - Pen-generated HTML/CSS pasted into production
  - giant boolean-flag components instead of composition
  - full-screen or unbounded blur of creator media
  - unvirtualized unbounded feeds (boundedness is the contract; virtualize before unbounding)
  - inaccessible custom controls
  - speculative dependencies (flash-list, expo-blur, zustand, moti, premature expo-video)
  - NativeWind adoption mid-migration; two styling systems
  - mixing legacy designTokens values into creator-first components
  - route contract changes without a recorded product decision
  - unapproved payment, chat, crypto, ratings, or follower-count contracts
