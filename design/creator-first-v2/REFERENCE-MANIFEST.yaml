version: 2
updated_at: "2026-08-13"
status: "founder_reference_set_complete_ready_for_design_architect"
purpose: >-
  Curated reference contract for the creator-first redesign. Apply each source
  only to the assigned problem; do not average all references into one style.

asset_policy:
  commit_binaries: false
  local_root: "design/creator-first/references"
  analysis_file: "design/creator-first/REFERENCE-ANALYSIS.md"
  preferred_format: "full-resolution PNG or JPG"
  annotation_authority:
    founder: "Explicit founder preference; highest visual-reference weight."
    research: "Distilled external research; useful but subordinate to founder decisions."
    audit: "Interpretation to validate during the design pass."

global_rules:
  - "Creator and work are primary; commerce is a quiet service layer."
  - "Use screenshots before live browsing."
  - "Never copy third-party logos, assets, text, or proprietary brand identity."
  - "Do not introduce data or interactions absent from the product audit."
  - "A mobile screenshot is required before approving a reference-dependent mobile interaction."

