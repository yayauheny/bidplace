asset_completion_gate:
  minimum_before_design_architect:
    wepresent: "Desktop and mobile Home/navigation/story evidence is sufficient; mobile creator profile remains useful but optional."
    gethyped: "Desktop work/card/story evidence is sufficient; add 2–3 mobile work/gallery views if available."
    medallion: "Eight mobile screenshots cover search, onboarding, profile media, validation, auth, Explore, actions, and detail sequencing; sufficient."
    avant_arte: "Desktop work/gallery/transaction evidence is sufficient; 2 mobile process/detail views remain strongly preferred."
    creator_publishing: "One four-screen mobile publishing reference is sufficient for visibility/sequencing; real bidplace fields and permissions come only from the audit."
    foundation: "Eight desktop screenshots are sufficient for Create/work/bid composition; all crypto semantics remain excluded."
    mobbin_awards: "Three creator-card/profile/bio screenshots are sufficient to evaluate a bounded lower caption effect."
    colors: "One desktop auth screenshot is sufficient for light welcome hierarchy; mobile auth derives from Medallion plus the brief."
    stationhead: "Current desktop asset is usable; add 1 mobile creator/release view if available."
    pinterest: "At least 1 desktop and 2 mobile Explore/recommendation views strongly preferred."
  can_start_without_full_completion: true
  rule: >-
    Missing supporting assets do not block audit files. They block only design
    decisions that depend on an unseen mobile or interaction pattern.
