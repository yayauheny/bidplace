  version: 2.1
  date: "2026-08-15"
  supersedes: "this packet V2 (2026-08-14). V1 beige/serif/all-rounded system remains retired."
  platforms: [web, ios, android]
  runtime: "Expo + React Native + React Native Web"
  viewports:
    desktop: 1440
    tablet: 1024
    mobile: 390
  language_primary: "ru"
  currency: "BYN"
  golden_screens_before_global_lock:
    - "home / desktop 1440"
    - "creator_profile / desktop 1440"
    - "work_detail LIVE / desktop 1440"
  golden_explorations_before_blueprint_lock: "3 directions × each golden screen (type / media / graphic). See screen-blueprints.yaml."
  logo:
    rule: "Existing reversed-b symbol is reused as-is. Redesign, retracing, and recoloring forbidden."
    symbol:
      display_size: {width: 28, height: 28}
      status: available_now
      source_assets:
        folder: "/Users/yayauheny/Downloads/Telegram Desktop/logo_assets_web_expo"
        copied_from: "web/logo-transparent-256.png"
      packet_target: "design/creator-first-v2/assets/logo/logo-transparent-256.png"
      pen_file: "design/creator-first-v2/assets/logo/logo-transparent-256.png"
