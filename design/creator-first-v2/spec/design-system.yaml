number_and_date_format:
  currency: "1 200 BYN (non-breaking thin space thousands separator, code after amount, non-breaking space before code)"
  datetime: "24 августа, 19:00"
  countdown_long: "2 дн 4 ч"
  countdown_short: "04:12 (mm:ss, only inside soft-close final phase)"
  bid_time: "сегодня, 14:32 / вчера, 09:15 / 21 августа, 18:04"

spacing:
  base: 4
  scale: [4, 8, 12, 16, 20, 24, 32, 40, 48, 64, 80, 96, 120, 160, 240]
  section_gap: {desktop: 96, tablet: 72, mobile: 48, lock: starting_value, note: "Not a mandate to space every section equally. Macro pauses may be larger."}
  intra_section_gap: {desktop: 40, tablet: 32, mobile: 24}
  card_padding: {desktop: 24, tablet: 20, mobile: 16}
  plate_padding: {desktop: 24, tablet: 24, mobile: 20}
  macro_whitespace:
    status: "allowed and expected; not a missing component"
    typical: [80, 120, 160, 240]
    rule: "Use chapter-level pauses. Do not think only in 16/24/32 component gaps. Do not auto-fill unused space."

shape:
  # V2.1: substantially straighter than V1. Pills are not the default language
  # and not forbidden. Radii below are starting values, not ideology.
  status: "provisional_until_golden_approval"
  radius_none: 0
  radius_media: 8
  radius_media_tight: 4
  radius_card: 8
  radius_control: 8
  radius_input: 8
  radius_dialog_desktop: 12
  radius_sheet_top_mobile: 16
  radius_chip: 4
  radius_pill: 999
  pill_not_default_on: ["scenes", "chapters", "auction_panel", "work_card", "creator_card", "large info plates", "editorial composition"]
  pill_allowed_when_it_helps: ["tabs", "filters", "tags", "status_chip", "compact functional controls"]
  pill_moderate_rounding_allowed: ["buttons", "search", "creator_action"]
  note: "Do not let pills define the product language. Do not force radius 4/8 simply because V1 used 24/28/999. Radius serves the composition."
  border_curve: "continuous (iOS borderCurve: continuous) on radius_control and above; radius_none stays sharp"

border:
  hairline: {width: 1, color: "hairline"}
  control: {width: 1.5, color: "border_control"}
  control_focus: {width: 2, color: "focus_ring"}
  control_error: {width: 2, color: "error"}
  accent_frame: {width: 0, usage: "V2 retired as a default. Do not put a 2px colored frame around every card. Strong color appears as a slab or tag, not a wrapping stroke."}
  ink_outline_button: {width: 1.5, color: "ink"}

elevation:
  e0: "none — default; separation via space, not a card chrome kit"
  e1: {shadow: "0 2px 8px rgba(17,17,17,0.08)", usage: "optional hover, floating bottom nav"}
  e2: {shadow: "0 8px 24px rgba(17,17,17,0.12)", usage: "sticky bid bar, nav overlay, lifted plate"}
  e3: {shadow: "0 16px 48px rgba(17,17,17,0.16)", usage: "dialogs, sheets"}
  rn_note: "Implement via boxShadow string syntax (RN 0.76+); Android parity verified in QA."

composition:
  status: "principles for golden explorations; not a frozen decoration quota and not a locked recipe"
  hard_product_constraints:
    - "LIVE: auction price + bid action visible without scroll at 1440; sticky bar counts at 390"
    - "no price/deadline on discovery cards"
    - "navigation and creator action reachable"
    - "text remains readable; contrast holds"
    - "overlaps never cover interactive controls, focus rings, or required facts"
    - "fixture stress cases (long names/titles, missing media, minimal content) still work"
  provisional_art_direction:
    - "portrait ~480×640, overlap ≤48px, statement width ~720, display_1 88 / display_2 56, specific plate positions — starting ranges only"
    - "negotiable until a golden candidate is selected"
  wepresent_owns: [information_architecture, whitespace, image_first_storytelling, curated_presentation, navigation_clarity]
  get_hyped_owns: [visual_attitude, type_scale, asymmetry, floating_media, independent_plates, variable_image_size, controlled_overlap, strong_color]
  forbidden_translation: "rounded colored container + tilted stack inside"
  page_must_not_reveal_component_system: true
  rigid_scene_chapter_rail_rhythm: false
  human_reading_rhythm:
    whitespace: "active compositional element, not leftover to fill"
    do_not_optimize_for: ["maximum information per viewport", "filling every grid column", "showing every metadata field", "equal spacing between every section", "equal visual weight for every component"]
    reading_order:
      - "What should I notice first?"
      - "What should I understand second?"
      - "What can I safely ignore until I choose to continue?"
    one_dominant_event: "A viewport should normally contain one dominant visual event. Secondary information supports it. Nav, links, status, CTA, cards, and decorative color must not compete at the same level."
    density: "local, not global. Allowed: dense work grid, compact bid history, dense filter row. Surround dense blocks with calmer space. Rhythm: quiet → dense → quiet → focal → quiet."
    chrome_before_gaps: "When crowded, remove card backgrounds, borders, chips, icons, and unneeded metadata before increasing gaps. Prefer content on canvas."
    empty_space: "valid if it creates hierarchy, separates chapters, focuses attention, or improves reading. Empty space is not a missing component."
    generated_rhythm: "forbidden. Do not repeat image+title+body or card-grid+card-grid. Change scale and density intentionally."
    ai_like_check: "If branding were removed, would this look like an AI-generated UI kit? If yes, revise."
  content_priority:
    creator_discovery: [portrait, name, discipline]
    work_discovery: [work, title, creator, one_descriptor]
    work_detail: [work, title_or_value, auction_action, story]
    rule: "Everything else is secondary or progressive disclosure. Do not surface a field merely because the API provides it."
  human_grouping: "Related information is one thought. Do not scatter one group across floating chips/cards. Example: «Полина Мирош ↗» then «Тихий берег»; utility actions secondary."
  avoid:
    - "centered magazine manifesto as the default home hero"
    - "3x2 identical image matrices as the visual signature"
    - "repeated equal-size cards as the only discovery pattern"
    - "identical section templates stacked down the page"
    - "locking one composition recipe before A/B/C explorations"
    - "algorithmically filled viewports"
    - "too many containers, badges, or equal-sized elements"
    - "suspiciously complete grid filling"
    - "uniform spacing everywhere"
    - "decorative asymmetry without reading purpose"
  allow:
    - "intentional negative space, including large empty zones"
    - "asymmetric balance"
    - "media that visually floats on canvas"
    - "independent text plates that may overlap media"
    - "variable image sizes and uneven vertical rhythm"
    - "occasional overlap that never covers interactive targets, focus rings, or required auction facts"
    - "large scale changes between sections"
    - "three exploration directions per golden screen (type / media / graphic)"
    - "dense local modules surrounded by chapter-level pauses"
  overlap_limits:
    max_overlap: 48
    lock: starting_value
    rule: "Overlap is compositional, not decorative garnish, and not required in every exploration. Never cover interactive targets, focus rings, auction price/action, or required text."
  tilt:
    default: 0
    stack_back_layers_max: "±8deg and only when the stack reads as a physical pile of images — not on every media_stack"
    filmstrip_default: 0
    hover_card: 0
    text_blocks: 0
    auction_surfaces: 0
  accent_surface_quota: "Not frozen. Strong accent is optional. Rule of thumb after selection: at most one dominant strong-color gesture in a viewport; discovery cards are not pastel frames."

