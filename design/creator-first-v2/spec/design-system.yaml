# bidplace creator-first — design system contract V2.1
# Direction: «Площадка авторов, а не журнал» (see DESIGN-DIRECTION.md)
# V2 art-direction is kept. V2.1 amends process, shape, display lock, and
# accent visibility. Token *ids* that fixtures already reference are preserved.
# Contrast ratios are computed intent (WCAG 2.x relative luminance);
# visual QA re-verifies rendered output.
# Do not freeze display type, radius, or accent-usage tokens until a golden
# candidate is selected after nine explorations (3 screens × 3 directions).

