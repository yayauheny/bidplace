    foreground: "#111111"
    contrast_intent: ">= 10:1 ink on yellow"
    usage: "High-energy graphic marks, tags, occasional independent plates, become-creator mark, soft-close banner fill."
    forbidden_usage: "Never white text on yellow; never paired with cream canvas as a dominant combo; never a pale wash behind serif type."
  accent_yellow_soft:
    value: "#FFF6A8"
    foreground: "#111111"
    contrast_intent: ">= 14:1 ink on soft"
    usage: "Tiny chips only. Prefer yellow_strong for any surface larger than a chip."
    forbidden_usage: "No white text; not scene/chapter fill; not a cream substitute."
  accent_pink_strong:
    value: "#FF3D8A"
    visual_name: "bright pink (Get Hyped energy)"
    foreground: "#111111"
    contrast_intent: ">= 4.6:1 ink on pink (re-check small text)"
    usage: "Tags, graphic slabs, occasional plates. Ink text only."
    forbidden_usage: "No white text; not error/success meaning."
  accent_pink_soft:
    value: "#FFD0E4"
    foreground: "#111111"
    contrast_intent: ">= 12:1 ink on soft"
