classification:
  # Shared taxonomy for every feature in this packet. Statuses order development;
  # they never limit design scope. Pen shows the whole future application.
  product_phase:
    confirmed_mvp: "Designed and implemented now; part of the MVP acceptance contract."
    designed_post_mvp: "Fully designed now (anatomy, states, a11y, UX contract); implemented later; appears in Pen only on labeled future boards."
    unresolved: "Designed only after an explicit product decision; appears only as a labeled concept card."
  implementation_status:
    available_now: "Current backend supports it."
    backend_required: "Design complete; implementation waits for the declared data/endpoints."
    product_decision_required: "Blocked on a founder/product decision, not on backend."
  rules:
    - "Default for every component and screen in this packet: product_phase confirmed_mvp, implementation_status available_now, unless the item declares otherwise."
    - "Every backend_required feature must declare: required data, required endpoint or event, permissions, optimistic behavior, expected errors, analytics event, and a graceful unavailable state until implemented."
    - "Nothing designed_post_mvp or unresolved may appear on MVP frames or inside MVP acceptance checks."
    - "Build priority order: creator → work → discovery/search → bid/auction → profile and work creation → follow, wishlist, video and other additional scenarios. Priority is assembly order, never permission to delete later capabilities."

accent_selection:
  purpose: "One deterministic assigned accent per entity; identical on every screen and every visit. Assigned accent is an identity source, not a mandate to show a large colored object. Not a pastel scene wrapper."
  algorithm_pseudocode: |
    # input: stableId — creator.slug for creators, product.publicId for works
    # output: index 0..5 into accent_order
    function accentIndex(stableId):
        h = 0
        for byte in utf8_bytes(stableId):
            h = (h * 31 + byte) mod 2^32
        return h mod 6
  # Fixture accent_assignments still use these ids (including brown at index 5).
  # Canonical color names: periwinkle, teal, orange, yellow, pink, red.
  # brown is a deprecated alias of red — see color.accent_red_* and color.accent_brown_*.
  accent_order: [periwinkle, teal, orange, yellow, pink, brown]
  canonical_names: [periwinkle, teal, orange, yellow, pink, red]
  deprecated_aliases:
    brown:
      canonical: red
      index: 5
      note: "Fixtures may still say accent: brown. Resolve to accent_red_*. Do not render a brown appearance."
  entity_keys:
    creator: "slug"
    work: "publicId"
  forbidden_inputs: ["position in the result list", "sort order", "current date or day", "viewport", "viewer identity or session", "colors derived from user media"]
  collision_note: "Adjacent items may share an accent; that is acceptable — variety comes from real media, not from forced rotation."
  assigned_vs_visible:
    assigned_accent: "Deterministic per entity. Always exists. Used for missing-media fallbacks and optional marks."
    visible_strong_accent: "Optional at composition level. Do not force a slab, tag, or plate because an entity has an assigned accent."
  usage_v2:
    strong_on_product: "Optional tags, independent graphic slabs, occasional info plates, selected editorial fields. Allowed — not required in every composition."
    composition_rules:
      - "Real media is the primary source of visual variety."
      - "One viewport should normally have at most one dominant strong-color gesture."
      - "Small secondary accent details are allowed."
      - "Do not place multiple unrelated strong slabs competing in the same viewport."
    soft_allowed: "Chips, hover fills, missing-media fallbacks, tiny indicators. Not default scene/card/chapter fills."
    forbidden_default: "Do not wrap every large scene, chapter, or discovery card in accent_*_soft. Do not return to pastel entity cards."
  fixed_assignments:
    rule: "Surfaces without an entity id use an explicitly fixed token; never a computed or rotating value."
    auth_accent_field: accent_periwinkle_strong  # V2: graphic blue field or media, not pale rectangle
    become_creator_band: canvas  # V2: type on canvas + ink CTA; not a pastel rounded band
    become_creator_mark: accent_yellow_strong  # optional small graphic mark beside the statement
    onboarding_intro_band: canvas
    future_board_chips: accent_yellow_strong
  precomputed: "Accent expectations for every fixture are precomputed in content-fixtures.yaml accent_assignments; the Pen builder uses those values verbatim and computes nothing."

color:
  # ---------- core neutrals (V2: near-white + ink, not vanilla/cream) ----------
  canvas:
    value: "#F5F5F3"
    foreground: "#111111"
    contrast_intent: "17.8:1 (ink on canvas)"
    usage: "Primary page background. Near-white cool-neutral. Not beige, not vanilla, not mandatory cream."
    forbidden_usage: "Never as text color; never behind white text; never replaced by #FAF4EA or similar cream."
  canvas_deep:
    value: "#ECECEA"
    foreground: "#111111"
    contrast_intent: ">= 16:1 with ink"
    usage: "Quiet input/search fills, skeleton base. Optional supporting band — not a warm identity color."
    forbidden_usage: "Not for primary buttons or status semantics; not a cream substitute."
  canvas_deep_hover:
    value: "#E2E2DE"
    foreground: "#111111"
    contrast_intent: ">= 14:1 with ink"
    usage: "Hover fill for quiet canvas_deep surfaces (search entry, quiet inputs); pointer devices only."
    forbidden_usage: "Never a resting fill; never for status semantics."
  surface:
    value: "#FFFFFF"
    foreground: "#111111"
    contrast_intent: "19.0:1 (ink on white)"
    usage: "Independent plates, dialogs, auction panel, floating text cards."
    forbidden_usage: "Not a mandatory wrapper around every image."
  ink:
    value: "#111111"
    foreground: "#FFFFFF"
    contrast_intent: "19.0:1 (white on ink)"
    usage: "Primary text; primary buttons; bid dialog summary; live status chip."
    forbidden_usage: "Not as a full-page dark theme; large ink fields are allowed as graphic slabs, not as the default canvas."
  ink_soft:
    value: "#5C5C59"
    foreground: null
    contrast_intent: "7.0:1 on canvas, 7.4:1 on white"
    usage: "Secondary text, captions, meta rows, placeholder text."
    forbidden_usage: "Not for body copy below 14px on accent strong yellow/pink/orange (use ink)."
  hairline:
    value: "#E1E1DC"
    foreground: null
    contrast_intent: "decorative separator; not a control boundary"
    usage: "Dividers, table rules, optional plate edges."
    forbidden_usage: "Not as input border (too low contrast)."
  border_control:
    value: "#7A7A74"
    foreground: null
    contrast_intent: ">= 3:1 vs canvas (non-text)"
    usage: "Default input/select borders, unchecked checkbox outline."
    forbidden_usage: "Not for text."
  disabled_surface:
    value: "#E8E8E4"
    foreground: "#8A8A84"
    contrast_intent: "exempt (disabled)"
    usage: "Disabled buttons and inputs."
    forbidden_usage: "Never for enabled controls."

  # ---------- accent pairs (ids preserved; values and usage rewritten) ----------
  # Strong colors appear on product surfaces. Soft colors are chips/hover only.
  # Do not assign every large scene a pale colored rounded rectangle.
  accent_periwinkle_strong:
    value: "#3A47FF"
    visual_name: "electric blue"
    foreground: "#FFFFFF"
    contrast_intent: "5.4:1 white on strong (AA large / re-check small)"
    usage: "Graphic slabs, tags, independent plates, auth color field. Label text >= 15px 600."
    forbidden_usage: "No ink text on it; not for error/success meaning; not a wrapping scene around media."
  accent_periwinkle_soft:
    value: "#D4D8FF"
    foreground: "#111111"
    contrast_intent: ">= 12:1 ink on soft"
    usage: "Chips, hover, missing-media fallbacks only."
    forbidden_usage: "No white text; not default scene/card/chapter fill."
  accent_teal_strong:
    value: "#0B8F78"
    visual_name: "sharp teal"
    foreground: "#FFFFFF"
    contrast_intent: "4.7:1 white on strong (AA large / re-check small — 15px 600 min)"
    usage: "Same roles as electric-blue strong."
    forbidden_usage: "No ink text on it."
  accent_teal_soft:
    value: "#C8EFE6"
    foreground: "#111111"
    contrast_intent: ">= 13:1 ink on soft"
    usage: "Chips/hover only."
    forbidden_usage: "No white text; not default large fill."
  accent_orange_strong:
    value: "#FF4E12"
    visual_name: "vivid orange"
    foreground: "#111111"
    contrast_intent: ">= 5.5:1 ink on orange"
    usage: "Graphic slabs, tags, plates. Ink text only."
    forbidden_usage: "No white text; not for error meaning."
  accent_orange_soft:
    value: "#FFD5C6"
    foreground: "#111111"
    contrast_intent: ">= 12:1 ink on soft"
    usage: "Chips/hover only."
    forbidden_usage: "No white text; not default large fill."
  accent_yellow_strong:
    value: "#F0DE00"
