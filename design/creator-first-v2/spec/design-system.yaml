media:
  aspect_ratios:
    portrait: "3:4"
    square: "1:1"
    landscape: "4:3"
    wide: "16:10"
    filmstrip_item: "3:4"
  fit: "cover, focal center default; no forced upscaling beyond 1.15x source"
  radius_default: "radius_media (8). Some hero images may use radius_media_tight (4) or radius_none. Do not use radius 24 on every image."
  tilt_limits:
    default: "0deg"
    stack_back_layer_1: "up to -8deg, only when ≥2 images and the stack is meant to read as a physical pile"
    stack_back_layer_2: "up to +6deg, only when ≥3 images"
    filmstrip_alternate: "0deg default; do not zigzag every process image"
    info_plate: "0deg — plates do not tilt"
    hover_card: "0deg — zoom inside crop only"
    text_blocks: "0deg"
    auction_surfaces: "0deg"
  overlap_limits:
    max_overlap: 48
    rule: "Overlap is compositional (independent plate vs media). Never covers interactive targets, focus rings, required text, or auction price/action."
  mirror_caption_effect:
    owner: "retired on product surfaces (V1 WePresent pass + V2). Do not reintroduce."
    anatomy: "Creator cards are portrait-first on canvas with ink meta below. No glass strip, no accent_soft frame."
    fallback: "photo_missing uses a strong accent slab + ink initial, not a pastel card"
    forbidden: "any other component, full-page use, per-creator manual tuning"

layout:
  span_formula: "span_n = n × column_width + (n−1) × gutter; column_width = (max_content_width − (columns−1) × gutter) / columns. Fractional px are exact contract values; Pen/auto-layout may round to the nearest 0.5 while keeping the row sum equal to max_content_width."
  desktop_1440:
    max_content_width: 1280
    margins: 80
    columns: 12
    gutter: 24
    column_width: 84.67
    spans: {span_3: 302, span_4: 410.67, span_6: 628, span_8: 845.33, span_12: 1280}
    top_bar_height: 72
    reading_column: 640  # max text measure, not a mandatory chapter container
    detail_side_column: 400
  tablet_1024:
    max_content_width: 928
    margins: 48
    columns: 12
    gutter: 20
    column_width: 59
    spans: {span_4: 296, span_6: 454, span_8: 612, span_12: 928}
    top_bar_height: 64
    reading_column: 608
    detail_side_column: 360
  mobile_390:
    max_content_width: 350
    margins: 20
    columns: 4
    gutter: 16
    column_width: 75.5
    spans: {span_2: 167, span_4: 350}
    top_bar_height: 56
    bottom_nav: {height: 64, float_offset: 12, safe_area: "plus bottom inset"}
    sticky_bid_bar: {height: 64, safe_area: "plus bottom inset"}
    scroll_bottom_padding: "96 + safe-area inset (content never hidden behind floating chrome)"

motion:
  intensity: "medium-low"
  durations:
    micro: 120
    standard: 200
    gallery: 240
    entrance: 280
  easings:
    standard: "cubic-bezier(0.2, 0, 0, 1)"
    decelerate: "cubic-bezier(0, 0, 0.2, 1)"
    settle: "cubic-bezier(0.16, 0.84, 0.44, 1)"
  patterns:
    hover_media_zoom: {scale: 1.03, duration: 200, easing: standard, note: "inside cropped frame; pointer devices only; no tilt"}
    card_lift: {translate_y: -2, shadow: "e0→e1", duration: 200, note: "subtle; do not advertise a card kit"}
    stack_settle: {rotation: "only when a stack actually uses tilt; otherwise none", duration: 280, easing: settle, trigger: "once on mount/in-view"}
    gallery_advance: {type: "slide 24px + crossfade", duration: 240, easing: standard}
    dialog_enter: {opacity: "0→1", translate_y: "16→0", duration: 200, easing: decelerate}
    sheet_enter: {translate_y: "100%→0", duration: 280, easing: decelerate}
    sticky_bar_enter: {translate_y: "72→0", duration: 200, easing: decelerate}
    inline_feedback_swap: {crossfade: 120}
    pressed_state: {scale: 0.98, duration: 120}
    live_dot_pulse: {opacity: "1→0.55→1", period: 2000, note: "the only looped animation; disabled under reduced motion"}
  forbidden: ["scroll-jacking", "background video", "continuous decorative loops (except live_dot_pulse)", "bounce > 1.02 scale", "hover-only meaning", "animation delaying price/status updates"]
  reduced_motion:
    rule: "All transitions become instant state swaps (0ms) or single 120ms opacity fades; stack renders final tilt without settle; live_dot static; skeleton shimmer becomes static two-tone; gallery advance is instant swap; sticky bar appears without slide."
    layout_guarantee: "No layout depends on animation completing."

accessibility:
  contrast: "WCAG AA minimum for all text and 3:1 for UI boundaries/focus; pairs listed per token; QA re-verifies rendered."
  touch_targets: "44x44 minimum everywhere; bottom-nav plus 48x48; filmstrip arrows 44x44."
  focus:
    ring: "2px focus_ring, offset 2 outside radius; focus_ring_inverse on ink surfaces"
    obscured_rule: "scroll offset accounts for sticky top bar and mobile sticky bid bar/bottom nav; focused element never fully covered (scroll-padding = chrome height + 8)"
    order: "matches visual reading order; overlapping decorative layers are not focusable"
  keyboard:
    gallery: "Left/Right arrows advance; Home/End jump; control is a real button"
    dialogs: "focus trap, Esc closes, focus returns to invoker"
    forms: "error summary focused after failed submit; role=alert on inline errors; aria-describedby links errors to fields (accessibilityHint/State on native)"
  screen_reader:
    status_chip: "status announced as text («Идут торги», «Релиз 24 августа, 19:00»)"
    price_updates: "polite live region on current price in LIVE panel"
    creator_action: "always has accessible name equal to its role label"
    decorative_media: "back stack layers and any decorative slabs hidden from tree"
  zoom_localization: "Layouts tolerate 200% text zoom (web) and long Russian strings; measure and wrap rules in typography.rules; no fixed-height text containers except single-line ellipsis slots declared in component content_limits."
  reduced_motion: "see motion.reduced_motion"

feasibility_notes:
  - "Blur: expo-image blurRadius; no WebGL. Mirror: transform scaleY(-1) on a cropped copy."
  - "Tilt/overlap: static transforms; RN + RNW support rotate/translate."
  - "Sticky panel/bars: absolute positioning + scroll events (Reanimated); no CSS-only dependency."
  - "Mixed-size layouts are deterministic flex compositions (not measurement-driven masonry). Golden screens may use irregular row recipes; do not force one repeating ABC grid."
  - "Variable fonts shipped as static instances for native reliability."
