    value: "#E10F24"
    visual_name: "DEPRECATED alias — renders as accent_red_strong (vivid red). Do not read this id as brown."
    foreground: "#FFFFFF"
    contrast_intent: "5.3:1 white on strong"
    usage: "Compatibility only. Fixtures and fixed_assignments may still say brown / accent_brown_*. Resolve to accent_red_strong."
    forbidden_usage: "No ink text; never render a brown appearance. New specs must use accent_red_strong."
    deprecation: "V2 remapped craft brown to red to keep fixture ids. V2.1 names the color red. Keep this alias until a mechanical fixture migration."
  accent_brown_soft:
    deprecated_alias_of: accent_red_soft
    value: "#FFD2D6"
    visual_name: "DEPRECATED alias — renders as accent_red_soft."
    foreground: "#111111"
    contrast_intent: ">= 12:1 ink on soft"
    usage: "Compatibility only. Resolve to accent_red_soft."
    forbidden_usage: "No white text; not default large fill; not beige. New specs must use accent_red_soft."
    deprecation: "Same as accent_brown_strong."

  # ---------- semantic (reserved; never decorative) ----------
  action_primary:
